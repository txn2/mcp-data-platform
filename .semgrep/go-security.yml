rules:
  # Rule 1: Unbounded slice allocation from struct field
  # Detects make([]T, len, cap) where cap comes from a struct field or
  # function parameter without a preceding bounds check. This can cause
  # OOM if the value is user-controlled (e.g., query parameter, request body).
  - id: unbounded-make-slice-capacity
    patterns:
      - pattern: make($TYPE, $LEN, $CAP)
      - pattern-not-inside: |
          if $CAP > $MAX {
            ...
          }
          ...
          make($TYPE, $LEN, $CAP)
      - pattern-not-inside: |
          if $CAP >= $MAX {
            ...
          }
          ...
          make($TYPE, $LEN, $CAP)
      - pattern-not-inside: |
          if ... > $CAP {
            ...
          }
          ...
          make($TYPE, $LEN, $CAP)
      - pattern-not-inside: |
          if ... >= $CAP {
            ...
          }
          ...
          make($TYPE, $LEN, $CAP)
      - pattern-not-inside: |
          $CAP = min($CAP, $MAX)
          ...
          make($TYPE, $LEN, $CAP)
      # A capacity is an integer. Requiring that keeps the rule on real
      # allocations: a two-element slice literal whose second element is a
      # selector (`[]string{a.Path, b.Name}`) reaches this rule as the same
      # AST shape a three-argument make() does, and was reported as a
      # capacity of a slice nobody allocated.
      - metavariable-type:
          metavariable: $CAP
          type: int
      - metavariable-regex:
          metavariable: $CAP
          regex: '^[a-zA-Z_]\w*\.[a-zA-Z_]\w*$'
    message: >-
      Slice allocation uses potentially unbounded capacity `$CAP`.
      If this value originates from user input (query parameter, request body,
      database row), an attacker can trigger OOM by supplying a large number.
      Add a bounds check: `if $CAP > maxAllowed { $CAP = maxAllowed }`.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe:
        - "CWE-770: Allocation of Resources Without Limits or Throttling"
      confidence: MEDIUM
      impact: HIGH
      technology:
        - go

  # Rule 2: Unbounded map allocation from struct field
  # Same pattern for make(map[K]V, size) where size is user-controlled.
  - id: unbounded-make-map-size
    patterns:
      - pattern: make($TYPE, $SIZE)
      - metavariable-regex:
          metavariable: $TYPE
          regex: '^map\[.+\].+'
      - pattern-not-inside: |
          if $SIZE > $MAX {
            ...
          }
          ...
          make($TYPE, $SIZE)
      - pattern-not-inside: |
          if $SIZE >= $MAX {
            ...
          }
          ...
          make($TYPE, $SIZE)
      - pattern-not-inside: |
          if ... > $SIZE {
            ...
          }
          ...
          make($TYPE, $SIZE)
      - pattern-not-inside: |
          if ... >= $SIZE {
            ...
          }
          ...
          make($TYPE, $SIZE)
      - pattern-not-inside: |
          $SIZE = min($SIZE, $MAX)
          ...
          make($TYPE, $SIZE)
      - metavariable-regex:
          metavariable: $SIZE
          regex: '^[a-zA-Z_]\w*\.[a-zA-Z_]\w*$'
    message: >-
      Map allocation uses potentially unbounded size hint `$SIZE`.
      If this value originates from user input, an attacker can trigger OOM.
      Add a bounds check: `if $SIZE > maxAllowed { $SIZE = maxAllowed }`.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe:
        - "CWE-770: Allocation of Resources Without Limits or Throttling"
      confidence: MEDIUM
      impact: HIGH
      technology:
        - go
