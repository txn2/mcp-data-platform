# Dovecot, the IMAP server a webhook source's imap input polls in the
# acceptance criteria (#2247). It overlays the image's own configuration: one account
# (the password is USER_PASSWORD), login over TLS only, and a Platform folder
# beside the inbox. The certificate is dev/.tls/dovecot, generated by
# dev/start.sh.
ssl = required
auth_allow_cleartext = no
passdb static {
  passdb_static_password = %{env:USER_PASSWORD}
}
userdb static {
}
namespace inbox {
  mailbox Platform {
    auto = subscribe
  }
}
# No per-process address-space cap: Dovecot's default is below what an x86
# emulator on an arm machine reserves, and every service fails to start under
# one.
default_vsz_limit = unlimited
