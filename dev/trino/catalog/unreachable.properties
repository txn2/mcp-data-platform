# A PostgreSQL source nothing listens on (#2032). Every query against it fails
# the way a source down for maintenance does: Trino answers EXTERNAL /
# JDBC_ERROR with the driver's connection failure, which mcp-trino classifies
# as temporary. The acceptance suite runs a managed script against it to check
# that such a run is recorded as the upstream's rather than the script's.
connector.name=postgresql
connection-url=jdbc:postgresql://127.0.0.1:1/unreachable
connection-user=unreachable
connection-password=unreachable
