# The scratch catalog: a Hive catalog over the dev SeaweedFS, with its table
# metadata in a file metastore under s3://dev-scratch/trino-metastore/. A
# registration creates an external table here whose location is the
# directory of an uploaded file in portal-assets, which is why this catalog
# reads the same object store the platform writes to.
#
# This is the shape the runbook for a deployment prescribes (one bucket for
# the metastore, one identity that can read the file buckets and write the
# metastore bucket), with dev's single S3 identity standing in for both.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://dev-scratch/trino-metastore/
hive.recursive-directories=false
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=dev-access-key
s3.aws-secret-key=dev-secret-key
