# The scratch catalog for managed resources: a Hive catalog over the dev MinIO,
# with its table metadata in a file metastore under
# s3://dev-scratch-resources/trino-metastore/.
#
# There are two scratch catalogs because there are two object stores, and a
# Hive catalog reads its metastore and its tables through ONE S3 client. Portal
# assets are on SeaweedFS (scratch.properties); managed resources are on MinIO,
# which is the backend in this stack that bounds a single PUT and so is the one
# the upload path is exercised against (#1631). A registration creates an
# external table here whose location is the directory of an uploaded file in
# managed-resources, which is why this catalog reads the store the platform
# writes resources to.
#
# A deployment has one object store and needs only one of these. The split is
# the dev stack modelling two backends at once so both write paths are covered.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://dev-scratch-resources/trino-metastore/
hive.recursive-directories=false
fs.native-s3.enabled=true
# `minio`, not localhost: this is the address inside the compose network, and
# it is a name the dev certificate carries so TLS verification passes. The JVM
# trusts that certificate through the truststore the trino service builds at
# start (dev/docker-compose.yml).
s3.endpoint=https://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=dev-access-key
s3.aws-secret-key=dev-secret-key
