# Trino for `make dev`: one node serving the scratch catalog a table
# registration writes into (docs/server/registered-tables.md) and a memory
# catalog for ad hoc queries. Sized for a laptop; nothing here is a
# production setting.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=512MB
query.max-memory-per-node=256MB
