# ACME Corporation Local Dev Environment
#
# PostgreSQL + SeaweedFS for testing the portal and admin UI against real API endpoints.
# The Go binary handles all schema migrations on startup.
#
# Usage:
#   make dev-up     # start services, wait for healthy
#   make dev-down   # stop and remove volumes

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acme-dev-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_secret
      POSTGRES_DB: mcp_platform
    ports:
      # Bind loopback only (like the other dev services below): local dev
      # connects via localhost, and an all-interfaces 0.0.0.0 bind both exposes
      # the DB on the LAN and collides with any other specific-address :5432
      # listener (e.g. a kubefwd-forwarded cluster Postgres on a 127.x alias).
      # Host port is auto-relocated by dev/start.sh (DEV_PG_PORT) when 5432 is
      # held by another stack; container port stays 5432. Defaults to 5432.
      - "127.0.0.1:${DEV_PG_PORT:-5432}:5432"
    volumes:
      - acme_postgres_data:/var/lib/postgresql/data
      # Init script creates the mcp_test and apitest databases used by the
      # mcp-test and api-test fixtures. Runs once on first startup against
      # a fresh data volume; `make dev-down` removes the volume so the
      # next `make dev` re-applies it.
      - ./fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/01-fixture-dbs.sql:ro
    healthcheck:
      # Over TCP: the init-phase temporary server answers only on the unix
      # socket, so a socket check reports it healthy before the final
      # server is up (#2253).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U platform -d mcp_platform"]
      interval: 3s
      timeout: 3s
      retries: 10

  # mcp-test: deterministic MCP fixture used by `make dev` to exercise
  # the platform's mcp-gateway connector against a real upstream.
  # dev/start.sh registers this as the `mcp-test-fixture` MCP connection
  # so its 12 tools (identity / data / failure / streaming) appear in
  # the platform's tools/list as `mcp-test-fixture__*`.
  #
  # Anonymous mode (no OIDC); the platform sends MCPTEST_DEV_KEY as
  # X-API-Key. Open http://localhost:9281/portal/ to inspect every call
  # the platform made (audit log + portal SPA).
  mcp-test:
    image: ghcr.io/plexara/mcp-test:v1.2.0@sha256:85b1d6af2b45a6a4dd9fc9d5278ad5bfdc642b258dfab52600851c26d77c74b7
    container_name: acme-dev-mcp-test
    environment:
      MCPTEST_DATABASE_URL: postgres://platform:platform_secret@postgres:5432/mcp_test?sslmode=disable
      MCPTEST_DEV_KEY: ${MCPTEST_DEV_KEY:-mcptest-dev-key-2024}
      MCPTEST_COOKIE_SECRET: ${MCPTEST_COOKIE_SECRET:-mcptest-dev-cookie-secret-please-change-32b}
    command: ["--config", "/app/configs/mcp-test.yaml"]
    volumes:
      - ./fixtures/mcp-test.yaml:/app/configs/mcp-test.yaml:ro
    ports:
      - "127.0.0.1:9281:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # api-test: deterministic HTTP fixture for the platform's apigateway
  # toolkit. dev/start.sh registers this as the `api-test-fixture` api
  # connection so `api_invoke_endpoint` / `api_discover` /
  # `api_export` have a working upstream out of the box.
  #
  # Anonymous mode (no OIDC); the platform sends APITEST_DEV_KEY as
  # X-API-Key. Open http://localhost:9282/portal/ to inspect every call
  # the platform made.
  api-test:
    image: ghcr.io/plexara/api-test:v1.1.0@sha256:0a2b5d255f54243525a49a6b5c62b88c52c9e34e157e160de97d303dddb4b19b
    container_name: acme-dev-api-test
    environment:
      APITEST_DB_URL: postgres://platform:platform_secret@postgres:5432/apitest?sslmode=disable
      APITEST_DEV_KEY: ${APITEST_DEV_KEY:-apitest-dev-key-2024}
      APITEST_COOKIE_SECRET: ${APITEST_COOKIE_SECRET:-apitest-dev-cookie-secret-please-change-32b}
    command: ["--config", "/app/configs/api-test.yaml"]
    volumes:
      - ./fixtures/api-test.yaml:/app/configs/api-test.yaml:ro
    ports:
      - "127.0.0.1:9282:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Trino: the query engine behind the trino toolkit's dev connections, with
  # a Hive `scratch` catalog over the dev SeaweedFS (file metastore under
  # s3://dev-scratch/) so a table registration (manage_table, Scratch Tables)
  # works against this stack, and a `memory` catalog for ad hoc queries.
  # Config under ./trino. dev/start.sh points TRINO_HOST/TRINO_PORT here and
  # enables the toolkit once Trino answers.
  trino:
    image: trinodb/trino:453@sha256:86f7a156aeeca1dda3a1ba1e97474913d10c75f8fb7cda0da1d29a52b5731e0c
    container_name: acme-dev-trino
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      # The deployment rules from docs/server/scratch-catalog.md, with dev's
      # own user unrestricted. mcp-scratch is the documented scratch identity;
      # mcp-scratch-no-procedures holds the scratch catalogs without the
      # procedures rule, which is the refusal a connection test names (#1888).
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
      - ./.tls/seaweedfs:/etc/trino/seaweedfs-certs:ro
    ports:
      - "127.0.0.1:9283:8080"
    # The scratch_resources catalog reads managed resources from the TLS
    # SeaweedFS, so the JVM has to trust the dev certificate. The default truststore
    # is root-owned and this container does not run as root, so the entrypoint
    # copies it somewhere writable, imports the certificate, and points the JVM
    # at the copy. Everything the JDK already trusted is still trusted: the
    # copy is the JDK's own cacerts with one certificate added.
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/tmp/dev-truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        JH=$$(ls -d /usr/lib/jvm/temurin/*)
        cp "$$JH/lib/security/cacerts" /tmp/dev-truststore.jks
        chmod u+w /tmp/dev-truststore.jks
        "$$JH/bin/keytool" -importcert -noprompt -alias acme-dev-seaweedfs \
          -file /etc/trino/seaweedfs-certs/public.crt \
          -keystore /tmp/dev-truststore.jks -storepass changeit > /dev/null
        exec /usr/lib/trino/bin/run-trino
    # No depends_on: a catalog opens its S3 connection on first use, so Trino
    # can boot beside the object stores, and dev/start.sh waits for each of
    # them itself.
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # api-test-tls: the api-test fixture behind TLS termination, for the one
  # pagination shape the fixture alone cannot produce (#1543): a connection
  # whose base_url is https:// over an upstream that sees plain HTTP and so
  # writes http:// into its Link and @odata.nextLink values. The certificate
  # is generated by dev/start.sh into dev/.tls (gitignored) and handed to the
  # connection as tls_ca_bundle_pem.
  api-test-tls:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: acme-dev-api-test-tls
    volumes:
      - ./tls/api-test-tls.conf:/etc/nginx/nginx.conf:ro
      - ./.tls:/etc/nginx/tls:ro
    ports:
      - "127.0.0.1:9284:8443"
    depends_on:
      - api-test

  # graphql: the GraphQL endpoint the graphql connection kind's acceptance
  # criteria run against. PostGraphile publishes the gqlfixture schema of the
  # gql_fixture database as GraphQL at http://localhost:9286/graphql, with
  # introspection, Relay connections and the default mutations. dev/start.sh
  # creates the database and applies dev/seed-graphql.sql before this service
  # starts, so the schema it reads is rebuilt on every `make dev`.
  graphql:
    image: graphile/postgraphile:4.14.0@sha256:ab8f433f0c42292845205f52c99f20804f25ec64edcc78553ddc76e25380230e
    container_name: acme-dev-graphql
    command:
      - --connection
      - postgres://platform:platform_secret@postgres:5432/gql_fixture
      - --schema
      - gqlfixture
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --disable-graphiql
      - --disable-query-log
      - --retry-on-init-fail
    ports:
      - "127.0.0.1:9286:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header 'Content-Type: application/json' --post-data '{\"query\":\"{ __typename }\"}' http://127.0.0.1:5000/graphql | grep -q Query"]
      interval: 3s
      timeout: 3s
      retries: 20

  # radicale: the CalDAV server the caldav connection kind's acceptance
  # criteria read (#2246). One account (dana / calendar-pw, dev/radicale);
  # each criterion makes the calendars it reads and removes them after.
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0@sha256:99a1145aafab55f211389a303a553109d06ff2c00f634847a52b8561bd01f172
    container_name: acme-dev-radicale
    ports:
      - "127.0.0.1:${DEV_RADICALE_PORT:-5232}:5232"
    volumes:
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -X PROPFIND http://127.0.0.1:5232/ | grep -q 401"]
      interval: 3s
      timeout: 3s
      retries: 20

  # dovecot: the IMAP server the imap connection kind's acceptance criteria
  # read (#2247), over IMAPS only. One account (platform / app-password); each
  # criterion makes the folder it reads and appends the mail it needs. The
  # unprivileged image listens on 31993 for IMAPS.
  dovecot:
    image: dovecot/dovecot:2.4.1@sha256:1296e0f1029cdd95e6849fb82f5d142a6e2a46218451773316cea678de75254b
    container_name: acme-dev-dovecot
    environment:
      USER_PASSWORD: app-password
    ports:
      - "127.0.0.1:${DEV_IMAPS_PORT:-9993}:31993"
    volumes:
      - ./.tls/dovecot:/etc/dovecot/ssl:ro
      - ./dovecot:/etc/dovecot/conf.d:ro

  # platform-lb: the two platform processes dev/start.sh runs, round-robined
  # behind one address with no session affinity, the way two pods behind a
  # service are (#1708). It also replaces origin 502 and 504 bodies the way the
  # CDN in front of a deployment does. `make acceptance` targets it. Started
  # only under the `replicas` profile, which dev/start.sh activates unless
  # DEV_REPLICAS=1.
  platform-lb:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: acme-dev-platform-lb
    profiles: ["replicas"]
    environment:
      DEV_API_PORT: "${DEV_API_PORT:-8080}"
      DEV_API_PORT_B: "${DEV_API_PORT_B:-8081}"
    volumes:
      - ./lb/platform-lb.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./lb/15-platform-host.envsh:/docker-entrypoint.d/15-platform-host.envsh:ro
    ports:
      - "127.0.0.1:${DEV_PROXY_PORT:-8082}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Keycloak: real OIDC + OAuth 2.1 IdP backing both:
  #   - operator portal login (auth.oidc + browser_session in platform.yaml)
  #   - the pre-seeded oauth-mcp-dev / oauth-api-dev connection fixtures
  # Realm + clients + dev users come from ./keycloak-realm.json, imported
  # on first boot. Re-runs of `make dev` re-use the existing realm; only
  # `make dev-down` (which removes the postgres volume) resets it -- so a
  # change to that file needs a dev-down before it takes.
  #
  # The portal client enables directAccessGrantsEnabled so the acceptance suite
  # can hold a REAL person session (#1759): it signs a dev user in and presents
  # the resulting id_token, whose audience is the portal client, which is what
  # auth.oidc.audience checks. A criterion about a key resolving to the same
  # identity as its owner's signed-in session has to be executed by an actual
  # signed-in session. Dev only: this realm is never a deployment's.
  #
  # 26.7 accepts the RFC 7523 JWT bearer grant a Google service account key
  # signs (#2061), so the Google connection's criteria exchange a real
  # assertion here: they register the issuer, its key, a client and a linked
  # user through the admin API on each run, which also reaches a realm
  # imported before they existed.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    container_name: acme-dev-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: platform
      KC_DB_PASSWORD: platform_secret
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:9090:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/mcp-platform.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/mcp-platform/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:3.88@sha256:98e034880fed76fdf508b20cae9de57b0e1f93f5910c89a94fe936af91c59abe
    container_name: acme-dev-seaweedfs
    # -volume.max is a count of volumes, not a size, and 5 was a hard ceiling
    # the seed reached: assets, resources and thumbnails all land in one
    # collection, and once five volumes existed every further write asked the
    # master to grow a sixth, got "Not enough data nodes found", and retried
    # until the caller's deadline. What that looked like from the portal was an
    # upload hanging for thirty seconds and then failing, and it was reached by
    # simply running the dev stack for a while.
    #
    # 50 volumes at a 128 MB limit bounds the stack at ~6 GB rather than the
    # ~50 GB the default 1 GB limit would allow, and small volumes are the
    # right shape here: dev objects are kilobytes, and a volume is only ever a
    # container for them.
    #
    # -metricsPort serves every component's Prometheus metrics (volume
    # capacity, per-bucket size and object count, S3 requests) for the
    # ClickStack bundle's substrate collector (#1900).
    command: >
      server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      -volume.max=50 -master.volumeSizeLimitMB=128 -metricsPort=9327
    ports:
      # Loopback only, matching the other dev services (see postgres above).
      - "127.0.0.1:${DEV_S3_PORT:-9000}:8333"
      - "127.0.0.1:${DEV_SEAWEEDFS_METRICS_PORT:-9327}:9327"
      # The master and the volume server, read for the cluster's disks on the
      # Storage page (#2148).
      - "127.0.0.1:${DEV_SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "127.0.0.1:${DEV_SEAWEEDFS_VOLUME_PORT:-9380}:8080"
    volumes:
      - acme_seaweed_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8333"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS over TLS: where managed resources are stored (#2245).
  #
  # A second SeaweedFS rather than a second port on the one above, so the
  # managed-resource store can be stalled on its own: #1870's criteria pause it
  # to show a webhook receiver acknowledges nothing it has not written, and
  # pausing a shared store would also freeze portal assets and the scratch
  # catalog's metastore. It serves S3 over HTTPS only (the plain port is not
  # published), because the AWS SDK writes differently over TLS: it sends a
  # payload with aws-chunked encoding and a trailing checksum, the shape
  # #1631's streaming upload path is written against.
  #
  # The certificate is self-signed and generated by dev/start.sh into dev/.tls,
  # beside the api-test one. The platform trusts it through AWS_CA_BUNDLE (the
  # AWS SDK reads that variable, and Go on macOS ignores SSL_CERT_FILE, so it
  # is the only way to trust a local certificate without touching the system
  # keychain); Trino trusts it through the truststore its own service builds,
  # because it reads the resource objects a registration points it at.
  #
  # 4.48 rather than the 3.88 above: 3.88's HTTPS listener closes every HTTP/2
  # request without an answer, and the platform's S3 client negotiates HTTP/2
  # over TLS, so every write failed with "unexpected EOF".
  seaweedfs-resources:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: acme-dev-seaweedfs-resources
    command: >
      server -s3 -s3.port=8333 -s3.port.https=8443
      -s3.cert.file=/etc/seaweedfs/tls/public.crt
      -s3.key.file=/etc/seaweedfs/tls/private.key
      -s3.config=/etc/seaweedfs/s3.json -dir=/data
      -volume.max=50 -master.volumeSizeLimitMB=128
    ports:
      # Loopback only, matching the other dev services.
      - "127.0.0.1:${DEV_S3_TLS_PORT:-9443}:8443"
    volumes:
      - acme_seaweed_resources_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - ./.tls/seaweedfs:/etc/seaweedfs/tls:ro
    healthcheck:
      # Any HTTP answer is ready: S3 refuses an anonymous GET / with 403,
      # which wget reports as a failure.
      test: ["CMD-SHELL", "wget -q -S --spider --no-check-certificate https://127.0.0.1:8443 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Prometheus: scrapes the platform's /metrics endpoint (OTEL_METRICS_ADDR
  # on the host, pinned to :9464 by dev/start.sh) so the portal's admin
  # "API Gateway" activity tab has a real data source via the platform's
  # authenticated PromQL proxy (observability.prometheus in platform.yaml).
  # Dev-only; production scrapes the platform through its own monitoring
  # stack. host.docker.internal lets this container reach the host-run
  # platform; extra_hosts maps it on Linux engines too.
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    container_name: acme-dev-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenTelemetry Collector: receives what the host-run platform exports over
  # OTLP (dev/start.sh enables tracing at sampler 1.0 and points
  # OTEL_EXPORTER_OTLP_ENDPOINT here) and writes each signal to a JSON-lines
  # file under dev/.otel/ (dev/otel-collector.yml). The acceptance suite reads
  # those files, so a criterion about a span is executed against what a real
  # collector received (#1892, #1893, #1894). Dev-only; production runs its own
  # collector (deployments/observability/otel-collector.yaml).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    container_name: acme-dev-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "127.0.0.1:${DEV_OTLP_PORT:-4317}:4317"
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
      - ./.otel:/var/lib/otelcol

  # Ollama: local embedding provider backing semantic indexing (#557). The
  # host-run platform points embedding.ollama.url at http://localhost:11434
  # (dev/platform.yaml), so bundling it here makes `make dev` exercise the
  # semantic path out of the box instead of silently degrading to lexical-only.
  # dev/start.sh pulls the nomic-embed-text model once the service is healthy.
  # CPU-only under Docker on macOS (no GPU passthrough) — embedding is slower
  # than a host/GPU Ollama but correct; the model volume persists across
  # `make dev` runs (only `make dev-down` wipes it).
  ollama:
    image: ollama/ollama:0.30.6@sha256:fbaaecc6c632a73c2b4ca25ef52dbee0b68d07783fcb850f916404c004040f90
    container_name: acme-dev-ollama
    ports:
      - "127.0.0.1:${DEV_OLLAMA_PORT:-11434}:11434"
    volumes:
      - acme_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # renderer: the headless Chrome the platform draws every tile in (#1787).
  # A deployment runs the same image as a second container in the platform's
  # pod; here the host-run replicas share this one on 127.0.0.1. The platform
  # dials its DevTools socket and answers every request the page makes
  # itself, so the renderer is never pointed at the platform.
  #
  # host.docker.internal resolves on Linux as it does on Docker Desktop, so
  # the acceptance suite can name an address the renderer COULD reach and
  # prove a document never does (issue_1787_test.go).
  renderer:
    image: chromedp/headless-shell@sha256:2d349b544a1ea6b5b5fd7c0fe99215ff662339c57407ee2e8c0a11af93516b04
    container_name: acme-dev-renderer
    ports:
      - "127.0.0.1:${DEV_RENDERER_PORT:-9222}:9222"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "256m"

  # mailpit: the SMTP server the dev stack's mail goes to, and the HTTP API
  # the acceptance run reads it back from (#1720). Nothing here forwards
  # anywhere: a deployment's real mail server is configured by an
  # administrator at run time, and a dev stack that could reach one would
  # eventually send a test message to a real person.
  mailpit:
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    container_name: acme-dev-mailpit
    ports:
      # 1025 is SMTP in, 8025 is the web UI and the JSON API out.
      - "127.0.0.1:${DEV_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${DEV_MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # mattermost: the chat upstream a notification channel of the mattermost
  # kind posts to (#1720). The preview image bundles its own database, so it
  # shares nothing with the platform's and can be reset on its own.
  #
  # It is seeded by dev/seed-mattermost.sh, which creates the first user (who
  # becomes the system administrator), a team and a channel, and writes the
  # token and channel id the acceptance run reads.
  mattermost:
    image: mattermost/mattermost-preview@sha256:8a16d7d7fb50cfdb59cdec644eeb8c67c6b714033a8b432c3fbe404108883d1c
    container_name: acme-dev-mattermost
    ports:
      - "127.0.0.1:${DEV_MATTERMOST_PORT:-8065}:8065"

volumes:
  acme_postgres_data:
  acme_seaweed_data:
  acme_seaweed_resources_data:
  acme_ollama_data:
