# TLS termination in front of the api-test fixture, for the one shape the
# acceptance suite cannot get from the fixture alone: a connection whose
# base_url is https:// over an upstream that sees plain HTTP and therefore
# writes http:// into its Link and @odata.nextLink values (#1543). The Host
# header is passed through so the links name the host the connection is
# pinned to.
events {}
http {
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/tls/api-test.crt;
    ssl_certificate_key /etc/nginx/tls/api-test.key;
    location / {
      proxy_pass http://api-test:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
