# ACME Corporation — Local Dev Configuration
#
# Usage:
#   make dev-up
#   go run ./cmd/mcp-data-platform --config dev/platform.yaml
#
# Then in another terminal:
#   cd ui && npm run dev
#   Open http://localhost:5173/portal/

apiVersion: v1

server:
  name: acme-data-platform
  transport: http
  # DEV_API_PORT is auto-relocated by dev/start.sh when :8080 is held by
  # another stack (e.g. a running DataHub). Defaults to 8080 when free.
  address: ":${DEV_API_PORT:-8080}"
  description: |
    ACME Corp's unified data platform providing governed access to the enterprise
    data warehouse (Trino/Iceberg), data catalog (DataHub), and object storage (S3).

    ## Available Data Domains

    - **Retail Analytics** — daily sales, store performance, regional trends
    - **Inventory Management** — stock levels, reorder alerts, warehouse utilization
    - **Financial Reporting** — revenue, margins, year-over-year comparisons
    - **Customer Insights** — segmentation, lifetime value, churn indicators

    ## Data Governance

    All data access is governed by the semantic layer. Business definitions,
    ownership, quality scores, and lineage are automatically surfaced alongside
    query results. Deprecated datasets include warnings and migration guidance.
  agent_instructions: |
    You are an AI assistant with access to ACME Corp's enterprise data platform.
    Follow these guidelines when helping users:

    ## Discovery First

    Always start by searching the data catalog (DataHub) before writing queries.
    Use `search` to find relevant datasets, then `fetch` a result's reference to
    read its schema, ownership, and quality scores before querying.

    ## Query Best Practices

    - Prefer aggregations over full table scans
    - Always include date filters to avoid unbounded queries
    - Use `LIMIT` when exploring unfamiliar tables
    - Reference the `iceberg` catalog for production data

    ## Communication Style

    - Present results with business context, not just raw numbers
    - Flag data quality warnings proactively
    - Suggest related analyses the user might find valuable
    - Use markdown tables for structured results

auth:
  # OIDC + browser_session enabled in dev so the login screen shows
  # the "Sign in with OIDC" button and operators can exercise the
  # full Keycloak flow. Realm + clients + test users are pre-seeded
  # from dev/keycloak-realm.json at first Keycloak boot.
  oidc:
    enabled: true
    issuer: "http://localhost:9090/realms/mcp-platform"
    client_id: "mcp-data-platform-portal"
    client_secret: "portal-dev-secret"
    audience: "mcp-data-platform-portal"
    role_claim_path: "realm_access.roles"
    role_prefix: "dp_"
    scopes: ["openid", "profile", "email"]
  browser_session:
    enabled: true
    # Dev-only HMAC signing key (base64-encoded 32 bytes). Production
    # deployments override via env var and never commit a real key.
    signing_key: "ZGV2LWJyb3dzZXItc2Vzc2lvbi1obWFjLWtleS0zMmJ5dGVzLnBs"
    cookie_name: "mcp_session"
    secure: false
  api_keys:
    enabled: true
    keys:
      - key: "acme-dev-key-2024"
        name: "admin"
        email: "admin@example.com"
        roles: ["admin"]
      - key: "acme-analyst-key"
        name: "analyst"
        email: "rachel.thompson@example.com"
        roles: ["inventory_analyst"]
      - key: "acme-engineer-key"
        name: "engineer"
        email: "marcus.johnson@example.com"
        roles: ["data_engineer"]
      - key: "acme-director-key"
        name: "director"
        email: "david.park@example.com"
        roles: ["regional_director"]
      # Two ordinary people who own their own work. They hold no admin role,
      # which is what makes them the pair an owner-authority check is exercised
      # against: one owns a script and what its runs produce, the other is
      # somebody else.
      - key: "acme-owner-key"
        name: "owner"
        email: "asset.owner@example.com"
        roles: ["collaborator"]
      - key: "acme-peer-key"
        name: "peer"
        email: "asset.peer@example.com"
        roles: ["collaborator"]

oauth:
  enabled: false

database:
  dsn: "postgres://platform:platform_secret@localhost:${DEV_PG_PORT:-5432}/mcp_platform?sslmode=disable"
  max_open_conns: 10

# Six ACME personas
personas:
  admin:
    display_name: "Administrator"
    # Both unprefixed (API-key auth, role = "admin") and dp_-prefixed
    # (Keycloak OIDC, filtered by role_prefix "dp_") variants are listed
    # so the same persona matches every login path. Same pattern repeats
    # on each persona below.
    roles:
      - admin
      - dp_admin
    tools:
      allow:
        - "*"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are the ACME data platform administrator with full access.

  collaborator:
    display_name: "Collaborator"
    roles:
      - collaborator
      - dp_collaborator
    tools:
      # "*" with no deny, rather than an enumerated list: the tools a person
      # needs to own their own work are a unit (search gates the query tools,
      # fetch dereferences what search returns), and an enumerated list loses
      # every tool a later release adds.
      allow:
        - "*"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are helping an ACME collaborator with their own assets, scripts and reference material.

  data-engineer:
    display_name: "Data Engineer"
    roles:
      - data_engineer
      - dp_engineer
    tools:
      allow:
        - "trino_*"
        - "datahub_*"
        - "s3_*"
      deny:
        - "s3_delete_*"
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are helping an ACME data engineer build and maintain data pipelines.
      agent_instructions_suffix: |
        Use iceberg catalog for production tables.
        Search the catalog before writing new queries.

  inventory-analyst:
    display_name: "Inventory Analyst"
    roles:
      - inventory_analyst
      - dp_analyst
    tools:
      allow:
        - "trino_query"
        - "trino_describe_table"
        - "trino_browse"
        - "search"
        - "fetch"
        - "datahub_browse"
        - "datahub_get_lineage"
        - "s3_list_*"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are helping an ACME inventory analyst track stock levels across 1,000 stores.
        Focus on the inventory and retail schemas.
      agent_instructions_suffix: |
        Start with inventory.inventory_levels for current stock.
        Check metadata before joining tables.

  regional-director:
    display_name: "Regional Director"
    roles:
      - regional_director
    tools:
      allow:
        - "trino_query"
        - "trino_describe_table"
        - "search"
        - "fetch"
        - "datahub_browse"
        - "s3_list_objects"
        - "s3_get_object"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are providing regional performance data to an ACME regional director.
        Focus on the analytics schema and regional reports.

  finance-executive:
    display_name: "Finance Executive"
    roles:
      - finance_executive
    tools:
      allow:
        - "search"
        - "fetch"
        - "datahub_browse"
        - "s3_list_objects"
        - "s3_get_object"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are providing financial insights to an ACME executive.
        Focus on revenue, margins, and high-level KPIs. Avoid technical details.

  store-manager:
    display_name: "Store Manager"
    roles:
      - store_manager
    tools:
      allow:
        - "trino_query"
        - "trino_describe_table"
        - "datahub_search"
        - "s3_get_object"
      deny: []
    connections:
      allow:
        - "*"
    context:
      description_prefix: |
        You are helping an ACME store manager access store-level data.
        Focus on daily sales, inventory, and employee scheduling.


  role_mapping:
    oidc_to_persona:
      "dp_admin": "admin"
      "dp_data_engineer": "data-engineer"
      "dp_inventory_analyst": "inventory-analyst"
      "dp_regional_director": "regional-director"
      "dp_finance_executive": "finance-executive"
      "dp_store_manager": "store-manager"
    user_personas:
      "sarah.chen@example.com": "admin"
      "marcus.johnson@example.com": "data-engineer"
      "amanda.lee@example.com": "data-engineer"
      "lisa.chang@example.com": "data-engineer"
      "rachel.thompson@example.com": "inventory-analyst"
      "emily.watson@example.com": "inventory-analyst"
      "david.park@example.com": "regional-director"
      "carlos.rodriguez@example.com": "regional-director"
      "jennifer.martinez@example.com": "finance-executive"
      "brian.taylor@example.com": "finance-executive"
      "kevin.wilson@example.com": "store-manager"
      "mike.davis@example.com": "store-manager"

# Toolkits: connect to remote ACME demo backends when env vars are set,
# otherwise fall back to local-only (S3 via SeaweedFS, no Trino/DataHub).
toolkits:
  trino:
    enabled: ${TRINO_ENABLED:-false}
    instances:
      acme:
        host: "${TRINO_HOST:-localhost}"
        port: ${TRINO_PORT:-8080}
        user: "${TRINO_USER:-}"
        password: "${TRINO_PASSWORD:-}"
        catalog: "warehouse"
        schema: "public"
        ssl: ${TRINO_SSL:-false}
        description: "ACME demo Trino — warehouse and opensearch catalogs"
        datahub_source_name: "trino"
      acme-staging:
        host: "${TRINO_HOST:-localhost}"
        port: ${TRINO_PORT:-8080}
        user: "${TRINO_USER:-}"
        password: "${TRINO_PASSWORD:-}"
        catalog: "staging"
        schema: "public"
        ssl: ${TRINO_SSL:-false}
        description: "ACME staging Trino — pre-production data validation"
      # The connection a table registration writes through (#1327), separate
      # from the two above because it needs two things they must not have.
      #
      # A `scratch` target says WHERE a registration writes; it grants nothing.
      # The statement that creates the table is write SQL, so a connection also
      # has to accept writes, and the two read-only connections above never
      # will. Putting the target on one of them produced a picker that offered
      # the connection and a 500 the moment it was chosen -- which is what the
      # portal reported as "the registration could not be completed".
      #
      # read_only is false here and only here. What keeps a registration off
      # the warehouse is not this flag but the Trino identity the connection
      # authenticates as: point TRINO_SCRATCH_USER at a principal that can
      # write the scratch schema and nothing else.
      acme-scratch:
        host: "${TRINO_HOST:-localhost}"
        port: ${TRINO_PORT:-8080}
        # One placeholder, not a placeholder defaulting to another one:
        # expansion is a single regex with no nesting, so an inner default
        # survives verbatim and lands in the DSN as a literal username. A
        # distinct scratch identity is a production concern (see
        # docs/server/registered-tables.md); dev reuses the one user it has.
        user: "${TRINO_USER:-}"
        password: "${TRINO_PASSWORD:-}"
        catalog: "${TRINO_SCRATCH_CATALOG:-scratch}"
        schema: "${TRINO_SCRATCH_SCHEMA:-uploads}"
        ssl: ${TRINO_SSL:-false}
        read_only: false
        description: "ACME scratch — registered tables over uploaded files"
        scratch:
          catalog: "${TRINO_SCRATCH_CATALOG:-scratch}"
          schema: "${TRINO_SCRATCH_SCHEMA:-uploads}"
    default: acme
    config:
      default_limit: 1000
      max_limit: 10000
      # Read-only by default, overridable, for the same reason as the DataHub
      # instance below: TRINO_HOST is a personal setting and may point at a
      # cluster that is not a toy.
      read_only: ${TRINO_READ_ONLY:-true}
      progress_enabled: true

  datahub:
    enabled: ${DATAHUB_ENABLED:-false}
    instances:
      acme:
        endpoint: "${DATAHUB_ENDPOINT:-http://localhost:8080}"
        token: "${DATAHUB_TOKEN:-}"
        # Writable, because a read-only connection exposes no writer, so the
        # portal reports writable: false and hides every Catalog edit control:
        # the whole write half of Tables, Context Docs, Tags, Domains, and
        # Glossary is untestable on a dev stack that pins this to true. Reaching
        # a DataHub at all already takes two deliberate settings
        # (DATAHUB_ENABLED, DATAHUB_ENDPOINT), and nothing here writes unattended
        # — a write happens only when someone edits in the portal. Set
        # DATAHUB_READ_ONLY=true when that endpoint is a catalog you share.
        read_only: ${DATAHUB_READ_ONLY:-false}
    default: acme

  s3:
    instances:
      dev-s3:
        enabled: true
        endpoint: "http://localhost:${DEV_S3_PORT:-9000}"
        region: "us-east-1"
        access_key_id: "dev-access-key"
        secret_access_key: "dev-secret-key"
        # use_path_style, not force_path_style: the latter is what the AWS SDKs
        # and MinIO call it, and it is what this said for a long time -- but
        # nothing reads it. toolkitcfg.S3Config reads "use_path_style", and an
        # unrecognized key in an instance block is silently ignored, so the
        # setting was simply absent and every write addressed the bucket as a
        # virtual host: http://portal-assets.localhost:29000/... , which
        # resolves to ::1, which SeaweedFS (bound to 127.0.0.1) refuses.
        use_path_style: true
        description: "Local SeaweedFS for portal assets and dev content"

  # mcp gateway: connections live in the database (added/edited via the
  # admin portal). Enabling this kind makes them load on platform start.
  mcp:
    enabled: true

# Providers: use datahub when available, noop otherwise
semantic:
  provider: "${SEMANTIC_PROVIDER:-noop}"
  instance: acme

query:
  provider: "${QUERY_PROVIDER:-noop}"
  instance: acme

enrichment:
  trino_semantic_enrichment: true
  datahub_query_enrichment: true
  # column_context_filtering: true   # Default: true

tuning:
  rules:
    require_datahub_check: true
    warn_on_deprecated: true
    quality_threshold: 0.7

portal:
  enabled: true
  public_base_url: "http://localhost:${DEV_API_PORT:-8080}"
  s3_connection: dev-s3
  s3_bucket: portal-assets

# Managed resources share the portal bucket in dev. Without this block they
# default to a "resources" bucket the dev SeaweedFS never creates, and every
# upload fails at storage — which made the whole resources surface untestable
# against the dev stack.
resources:
  managed:
    enabled: true
    s3_connection: dev-s3
    s3_bucket: portal-assets

memory:
  embedding:
    provider: ollama
    ollama:
      url: "http://localhost:${DEV_OLLAMA_PORT:-11434}"
      model: "nomic-embed-text"

knowledge:
  enabled: true
  apply:
    enabled: true
    require_confirmation: true

admin:
  enabled: true
  persona: admin
  path_prefix: /api/v1/admin

audit:
  enabled: true
  log_tool_calls: true
  retention_days: 90

# Observability: the PromQL query proxy that powers the admin Dashboard's
# "API Gateway" activity tab. Points at the dev Prometheus (docker-compose
# service "prometheus", mapped to host :9091), which scrapes the platform's
# /metrics endpoint (OTEL_METRICS_ADDR=:9464, set by dev/start.sh). Admin
# personas already allow the observability:read capability via "*". With no
# gateway traffic yet, the tab shows its empty state; invoke an api_* tool
# against the api-test-fixture connection to populate it.
observability:
  prometheus:
    url: "http://localhost:9091"
    timeout: 10s

# The util connection refuses internal address space by default. In dev the
# api-test fixture is on the loopback (:9282), and the acceptance suite walks
# it through fetch_url (test/acceptance, #1544), so the loopback is allowed
# here and nowhere else.
apigateway:
  util_connection:
    allow_private_cidrs:
      - 127.0.0.0/8
      - ::1/128
