name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}  # Restrict default token permissions

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for keyless signing with Cosign
      attestations: write  # Required for GitHub attestations
      actions: read  # The E2E Nightly's last result, read by the tag rules (#2036)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      # goreleaser's before-hook builds the portal (make frontend-build) on the
      # Node major the frontend is tested on (#1976).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Verify and prepare Go modules
        run: |
          go mod download
          go mod verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "ERROR: HOMEBREW_TAP_TOKEN secret is not set!"
            exit 1
          fi
          echo "Token is set (length: ${#HOMEBREW_TAP_TOKEN} chars)"
          # Test API access to homebrew-tap
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/txn2/homebrew-tap")
          echo "API response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Token cannot access txn2/homebrew-tap (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Token verified - can access homebrew-tap"

      # A final tag sits on the commit its last release candidate was built
      # from, and every release measures its changelog from the last FINAL
      # release, never from a candidate (#2012). A final tag is refused while
      # the most recent E2E Nightly on main failed (#2036).
      - name: Release candidate rules
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-tag.py check "$TAG"
          echo "previous=$(python3 scripts/release-tag.py previous "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2.13"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            _dist/*.tar.gz
            _dist/*.zip
            _dist/*checksums*.txt

  # NOTE: The slsa-github-generator provenance job was removed due to a false
  # positive "private repository" detection that halts on public repos.
  # See: https://github.com/slsa-framework/slsa-github-generator/issues
  # In its place, the "Attest build provenance" step above produces GitHub
  # artifact attestations (actions/attest-build-provenance) for the release
  # archives and checksums, earning the granted attestations: write permission.
  # The slsa-github-generator job can replace those attestations when the
  # upstream bug is fixed.
