# Benchmark trend (#2716): the hot-path benchmarks' ns/op, week over week.
#
# ns/op is tracked here and never gated: a shared runner's timing varies more
# than most regressions, which is why a pull request is held to allocations
# per call instead (make bench-allocs). This run measures every benchmark
# scripts/bench-allocs.tsv lists -count=10, compares them with the last
# successful run on main using benchstat, and writes the comparison to the job
# summary. Its result reaches the "Benchmark Trend is failing" issue like every
# scheduled workflow's (#2730).
name: Benchmark Trend

on:
  schedule:
    # 09:00 UTC Mondays, after the weekly Load run.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend:
    name: Benchmark trend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install benchstat
        run: GOTOOLCHAIN=local go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260819171926-ebcb4798430d

      - name: Run the benchmarks
        run: make bench-trend

      - name: Fetch the last run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow bench-trend.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$last" ]; then
            gh run download "$last" -n bench-trend -D build/bench/previous || true
          fi

      - name: Compare with benchstat
        run: |
          {
            echo "### Benchmark trend"
            echo
            if [ -f build/bench/previous/current.txt ]; then
              echo '```'
              benchstat build/bench/previous/current.txt build/bench/current.txt
              echo '```'
            else
              echo "No earlier run on main to compare with; this run is the first baseline."
              echo
              echo '```'
              benchstat build/bench/current.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this run for the next comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-trend
          path: build/bench/current.txt
          retention-days: 90

  # The verdict goes to the "<workflow> is failing" issue (#2730): opened or
  # commented on when the run failed, closed when it passed. Main only, on
  # success and failure; a cancelled run says nothing. issues: write is this
  # job's alone.
  report:
    name: Report to the tracking issue
    needs: [trend]
    if: (success() || failure()) && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: python3 scripts/scheduled_report.py report "$OUTCOME"
