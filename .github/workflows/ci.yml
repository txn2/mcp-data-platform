name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  # What a follow-up push to a pull request needs to check (#2535). A push
  # after a green run is checked against the merge that run tested: Go tests
  # for the packages the change affects and their importers, lint and gosec on
  # the change, the frontend only when ui/ changed, and the criteria of the
  # tickets it touches. A pull request's first run, a run with no green
  # ancestor, every push to main, and a change to a file that decides how the
  # gates run (scripts/ci-delta.py FULL_RUN_FILES) run everything. Lint, Test
  # and Build always run, so the checks a merge requires are never skipped.
  delta:
    name: Delta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.base.outputs.mode }}
      old_head: ${{ steps.base.outputs.old_head }}
      old_main: ${{ steps.base.outputs.old_main }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the last green run
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/ci-delta.py ci-base

      - name: Read what the change touches
        id: scope
        # Through the environment, never interpolated into the script: the
        # reason can carry text a pull request's author chose (a branch name).
        env:
          MODE: ${{ steps.base.outputs.mode }}
          REASON: ${{ steps.base.outputs.reason }}
          OLD_HEAD: ${{ steps.base.outputs.old_head }}
          OLD_MAIN: ${{ steps.base.outputs.old_main }}
        run: |
          if [ "$MODE" = "delta" ]; then
            DELTA_BASE=$(python3 scripts/ci-delta.py rebuild "$OLD_HEAD" "$OLD_MAIN")
            export DELTA_BASE
          fi
          if python3 scripts/ci-delta.py ui; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi
          python3 scripts/ci-delta.py summary "$MODE" "$REASON" >> "$GITHUB_STEP_SUMMARY"

      # The two commits this run tests, which the next push reads to rebuild
      # the merge (and the tree it must come back as, or that push runs in
      # full).
      - name: Record the tested commits
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-delta.py record-tested > tested.json

      - name: Upload the tested commits
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tested
          path: tested.json
          retention-days: 30

  lint:
    name: Lint
    needs: delta
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so golangci-lint's --new-from-rev (below) can diff against
          # the base commit locally. Shallow (default depth 1) has no base to diff.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      # The base a follow-up push is checked against (#2535): the merge the
      # last green run tested, rebuilt from its two parents. Every Makefile
      # target and script that reads a diff reads DELTA_BASE in place of the
      # merge base with main.
      - name: Rebuild the delta base
        if: needs.delta.outputs.mode == 'delta'
        env:
          OLD_HEAD: ${{ needs.delta.outputs.old_head }}
          OLD_MAIN: ${{ needs.delta.outputs.old_main }}
        run: echo "DELTA_BASE=$(python3 scripts/ci-delta.py rebuild "$OLD_HEAD" "$OLD_MAIN")" >> "$GITHUB_ENV"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Only NEW issues fail the build; pre-existing debt is baselined. We use
          # golangci-lint's own git-based --new-from-rev rather than the action's
          # only-new-issues: the latter fetches the PR diff from the GitHub API,
          # which hard-fails on diffs over 20000 lines (large refactors) and then
          # falls back to a full-repo scan that surfaces pre-existing issues. The
          # git-based diff has no size cap and matches `make verify` locally.
          # Base: the last green tree on a delta run (#2535), the PR target tip
          # on pull_request, the pre-push tip on push.
          # The timeout is .golangci.yml's (10m), as it is locally: a toolchain bump
          # invalidates the analysis cache and a cold run took 340s on #2064.
          args: --new-from-rev=${{ env.DELTA_BASE || github.event.pull_request.base.sha || github.event.before }}

  test:
    name: Test
    needs: delta
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real Postgres (pgvector) backs the migration gate:
    # TestMigrationsAgainstRealPostgres applies every migration + the dev seed
    # against this service, catching SQL the planner only rejects against a live
    # engine (e.g. a non-IMMUTABLE function in an index expression). The test
    # skips when MIGRATE_TEST_DSN is unset, so it is a no-op without this service.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: migrate
          POSTGRES_PASSWORD: migrate
          POSTGRES_DB: migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrate -d migrate_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The next major, because the majors disagree about what SQL is legal and
      # a deployment picks its own. Keep in step with MIGRATE_PG_IMAGES in the
      # Makefile.
      postgres17:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: migrate
          POSTGRES_PASSWORD: migrate
          POSTGRES_DB: migrate_check
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U migrate -d migrate_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The schedule lane diffs against the merge base with main.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      # The base a follow-up push is checked against (#2535): the merge the
      # last green run tested, rebuilt from its two parents. Every Makefile
      # target and script that reads a diff reads DELTA_BASE in place of the
      # merge base with main.
      - name: Rebuild the delta base
        if: needs.delta.outputs.mode == 'delta'
        env:
          OLD_HEAD: ${{ needs.delta.outputs.old_head }}
          OLD_MAIN: ${{ needs.delta.outputs.old_main }}
        run: echo "DELTA_BASE=$(python3 scripts/ci-delta.py rebuild "$OLD_HEAD" "$OLD_MAIN")" >> "$GITHUB_ENV"
      - name: Read whether the change touches a migration
        if: needs.delta.outputs.mode == 'delta'
        run: |
          if python3 scripts/ci-delta.py files | grep -q '^pkg/database/migrate/'; then
            echo "DELTA_MIGRATIONS=yes" >> "$GITHUB_ENV"
          fi

      # Every package on a full run; on a delta run the packages the change
      # affects and every package importing one (#2535).
      - name: Run tests with coverage
        env:
          MIGRATE_TEST_DSN: postgres://migrate:migrate@localhost:5432/migrate_check?sslmode=disable
        run: |
          pkgs=$(python3 scripts/ci-delta.py packages)
          if [ -z "$pkgs" ]; then
            echo "The change since the last green run affects no Go package."
            echo "mode: atomic" > coverage.out
            exit 0
          fi
          # shellcheck disable=SC2086 # one word per package
          go test -v -race -coverprofile=coverage.out -covermode=atomic $pkgs

      # The integration-tagged test/e2e tests that need none of the e2e
      # services, the same target `make verify` runs (#2342). Only the E2E
      # Nightly ran the package before, so a test pinning the old behavior of a
      # deliberate change failed the morning after the merge.
      - name: E2E tests that need no service
        run: make e2e-standalone

      # An acceptance criterion that asserts text the pull request removed
      # from production Go (#2519), the same target `make verify` runs. The
      # criteria run here only when their own file changed, and the whole
      # suite only in the E2E Nightly: #2498 changed a refusal issue 2171's
      # criterion asserted, and the nightly after the merge refused v1.153.2.
      - name: Acceptance criteria asserting removed text
        if: github.event_name == 'pull_request'
        run: make acceptance-copy-check

      # Every Go package the pull request changed, at -race -cpu=1,2 -count=5,
      # the same target `make verify` runs (#1711). A test whose assertion
      # depends on goroutine ordering passes the single run above and fails
      # here at one CPU.
      - name: Schedule lane (changed packages at -cpu=1,2 -count=5)
        if: github.event_name == 'pull_request'
        run: make schedule-lane

      # Real-DB round-trip gate for tool write paths. Self-provisions pgvector
      # via testcontainers (Docker is available on ubuntu-latest runners) and
      # runs every *RealDB* test against the real schema. This is the gate the
      # prompt-create defect bypassed: sqlmock rubber-stamped an INSERT that real
      # Postgres rejects (NULL into NOT NULL tags). Blocks merge on failure.
      # The same migration gate against the next PostgreSQL major. PostgreSQL 17
      # restricts search_path to pg_catalog and pg_temp during maintenance
      # operations, so an index expression whose function body calls a function
      # of ours builds on 16 and fails on 17. Running the gate on one major
      # reported exactly that as green and it reached a release (000102, fixed
      # by 000111). One major is not a gate.
      - name: Run migration gate against PostgreSQL 17
        if: needs.delta.outputs.mode != 'delta' || contains(env.DELTA_MIGRATIONS, 'yes')
        env:
          MIGRATE_TEST_DSN: postgres://migrate:migrate@localhost:5433/migrate_check?sslmode=disable
        run: go test -count=1 -run TestMigrationsAgainstRealPostgres ./pkg/database/migrate/

      - name: Run real-DB round-trip gate
        run: make test-realdb

      # Threshold must equal COVERAGE_MIN in the Makefile and the Codecov
      # project target; TestGateFiguresAgree (test/structure/pins_test.go) enforces that.
      - name: Check coverage threshold
        if: needs.delta.outputs.mode != 'delta'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 82" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 82% threshold"
            exit 1
          fi

      # A delta run tests part of the module, so its total is not the
      # module's: the threshold and the upload are a full run's, and the
      # change itself is held to the patch threshold here (#2535).
      - name: Check patch coverage of the change
        if: needs.delta.outputs.mode == 'delta'
        run: make patch-coverage-check

      - name: Upload coverage to Codecov
        if: needs.delta.outputs.mode != 'delta'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    needs: delta
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Verify dependencies
        run: go mod verify

  frontend:
    name: Frontend Build
    needs: delta
    if: ${{ !cancelled() && (needs.delta.outputs.mode != 'delta' || needs.delta.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Type check
        run: cd ui && npx tsc --noEmit

      # The API description converts to the OpenAPI 3 the UI's type
      # generation reads (#2022); the same target runs in make verify.
      - name: API description converts to OpenAPI 3
        run: make apidocs-openapi3-check

      # Frontend complexity/coupling/layering gate (#816), the analog of the Go
      # golangci-lint job. Error-level rules (complexity <= 10,
      # cognitive-complexity <= 15, import cycles) fail the build; warning-level
      # rules (size/fan-out proxies) do not affect the exit code. Existing
      # error-level violations are ratcheted via ui/eslint-suppressions.json, so
      # only NEW violations fail — mirroring golangci-lint's only-new-issues.
      - name: Lint
        run: cd ui && npm run lint

      - name: Unit tests
        run: cd ui && npm test

      - name: Build
        run: cd ui && npm run build

  frontend-e2e:
    name: Frontend E2E
    needs: delta
    if: ${{ !cancelled() && (needs.delta.outputs.mode != 'delta' || needs.delta.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    # The suite takes about ten minutes. A step that hangs (a browser install
    # that never finishes unpacking, #1976) fails here instead of holding the
    # runner for the six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      # Interactive Playwright suite against the MSW-mocked vite dev server
      # (the playwright config starts it via webServer), so no backend or
      # database services are required.
      - name: Run interactive E2E suite
        run: cd ui && npm run test:e2e

  security:
    name: Security Scan
    needs: delta
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      # The base a follow-up push is checked against (#2535): the merge the
      # last green run tested, rebuilt from its two parents. Every Makefile
      # target and script that reads a diff reads DELTA_BASE in place of the
      # merge base with main.
      - name: Rebuild the delta base
        if: needs.delta.outputs.mode == 'delta'
        env:
          OLD_HEAD: ${{ needs.delta.outputs.old_head }}
          OLD_MAIN: ${{ needs.delta.outputs.old_main }}
        run: echo "DELTA_BASE=$(python3 scripts/ci-delta.py rebuild "$OLD_HEAD" "$OLD_MAIN")" >> "$GITHUB_ENV"

      # Every package on a full run; on a delta run the packages with a
      # production Go file the change touches, as make verify's security-diff.
      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261015133444-707f2271f665
          if [ -n "${DELTA_BASE:-}" ]; then
            pkgs=$(python3 scripts/verify-diff.py gosec-packages)
            if [ -z "$pkgs" ]; then echo "The change touches no production Go file."; exit 0; fi
            # shellcheck disable=SC2086 # one word per package
            gosec $pkgs
          else
            gosec ./...
          fi

      # The action has no way to accept a finding and exits non-zero whenever
      # our code calls a vulnerable symbol, fix or no fix. These are the same
      # two commands `make security` runs, against the same allow file, so a
      # green local run and a green CI run mean the same thing.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0  # GOVULNCHECK_VERSION in the Makefile
          set +e
          govulncheck -format json ./... > govulncheck-report.json
          status=$?
          set -e
          if [ $status -ne 0 ] && [ $status -ne 3 ]; then
            echo "govulncheck failed to run (exit $status)"
            exit 1
          fi
          python3 scripts/govulncheck-gate.py govulncheck-report.json

      # The same target `make security` ends with, so an advisory govulncheck's
      # database does not carry (#2143) fails CI as it fails a local verify.
      - name: Run osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1  # OSV_SCANNER_VERSION in the Makefile
          make osv

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/golang
            .semgrep/

  # A pull request that changes how the dev stack starts or how the acceptance
  # suite is launched runs one acceptance group on the runner's OS before it
  # merges (#2274): the suite otherwise runs on Linux only in the E2E Nightly,
  # and #2264 and #2266 each passed every local run and failed every nightly
  # group. scripts/acceptance-pr-paths.py names the paths.
  stack-changes:
    name: Stack changes
    needs: delta
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      tickets: ${{ steps.paths.outputs.tickets }}
      ticket_groups: ${{ steps.paths.outputs.ticket_groups }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The base a follow-up push is checked against (#2535): the merge the
      # last green run tested, rebuilt from its two parents. Every Makefile
      # target and script that reads a diff reads DELTA_BASE in place of the
      # merge base with main.
      - name: Rebuild the delta base
        if: needs.delta.outputs.mode == 'delta'
        env:
          OLD_HEAD: ${{ needs.delta.outputs.old_head }}
          OLD_MAIN: ${{ needs.delta.outputs.old_main }}
        run: echo "DELTA_BASE=$(python3 scripts/ci-delta.py rebuild "$OLD_HEAD" "$OLD_MAIN")" >> "$GITHUB_ENV"

      # The paths since the PR base, or on a delta run since the last green
      # tree, so a follow-up push runs the criteria of the tickets it touches.
      - name: Read the changed paths
        id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${DELTA_BASE:-}" ]; then range="$DELTA_BASE"; else range="$PR_BASE_SHA...HEAD"; fi
          changed=$(git diff --name-only "$range" | python3 scripts/acceptance-pr-paths.py)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "The diff changes the dev stack or the suite's harness: $changed"
          tickets=$(git diff --name-only "$range" | python3 scripts/acceptance-pr-paths.py --tickets)
          echo "tickets=$tickets" >> "$GITHUB_OUTPUT"
          echo "The diff changes the criteria of tickets, or a tool they call: ${tickets:-none}"
          groups=$(git diff --name-only "$range" | python3 scripts/acceptance-pr-paths.py --ticket-groups)
          echo "ticket_groups=$groups" >> "$GITHUB_OUTPUT"

  # The smallest group the nightly runs, one criterion on a stack started as
  # the nightly starts it, with make dev-smoke first: the stack's start and the
  # suite's launch are what this proves, not the criteria.
  acceptance:
    name: Acceptance (worker-off)
    needs: stack-changes
    if: needs.stack-changes.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance-run.yml
    with:
      environment: worker-off
      id: pr-worker-off
      smoke: true
      timeout-minutes: 60

  # The criteria a pull request changes, on a stack started as the nightly
  # starts it: a fresh Linux runner with no .env (#2341). They were otherwise
  # run only on the author's machine before merge, and #2179's passed there
  # with a field-encryption key the runners never had, then failed the first
  # nightly after the merge. The criteria of a file the diff leaves alone run
  # too when the file calls a tool whose registering package the diff changes
  # (#2543): on #2542 six such files passed this job by not being in it and
  # failed the nightly. A widely called tool reaches many tickets, so they run
  # in up to eight jobs at once.
  acceptance-changed:
    name: Acceptance (changed criteria)
    needs: stack-changes
    if: needs.stack-changes.outputs.tickets != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tickets: ${{ fromJSON(needs.stack-changes.outputs.ticket_groups) }}
    uses: ./.github/workflows/acceptance-run.yml
    with:
      environment: dev
      tickets: ${{ matrix.tickets }}
      id: pr-changed-${{ strategy.job-index }}
