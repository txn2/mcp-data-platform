name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so golangci-lint's --new-from-rev (below) can diff against
          # the base commit locally. Shallow (default depth 1) has no base to diff.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          # Only NEW issues fail the build; pre-existing debt is baselined. We use
          # golangci-lint's own git-based --new-from-rev rather than the action's
          # only-new-issues: the latter fetches the PR diff from the GitHub API,
          # which hard-fails on diffs over 20000 lines (large refactors) and then
          # falls back to a full-repo scan that surfaces pre-existing issues. The
          # git-based diff has no size cap and matches `make verify` locally.
          # Base: the PR target tip on pull_request, the pre-push tip on push.
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real Postgres (pgvector) backs the migration gate:
    # TestMigrationsAgainstRealPostgres applies every migration + the dev seed
    # against this service, catching SQL the planner only rejects against a live
    # engine (e.g. a non-IMMUTABLE function in an index expression). The test
    # skips when MIGRATE_TEST_DSN is unset, so it is a no-op without this service.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: migrate
          POSTGRES_PASSWORD: migrate
          POSTGRES_DB: migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrate -d migrate_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run tests with coverage
        env:
          MIGRATE_TEST_DSN: postgres://migrate:migrate@localhost:5432/migrate_check?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # Real-DB round-trip gate for tool write paths. Self-provisions pgvector
      # via testcontainers (Docker is available on ubuntu-latest runners) and
      # runs every *RealDB* test against the real schema. This is the gate the
      # prompt-create defect bypassed: sqlmock rubber-stamped an INSERT that real
      # Postgres rejects (NULL into NOT NULL tags). Blocks merge on failure.
      - name: Run real-DB round-trip gate
        run: make test-realdb

      # Threshold must equal COVERAGE_MIN in the Makefile and the Codecov
      # project target; TestGateFiguresAgree (pins_test.go) enforces that.
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 82" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 82% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Verify dependencies
        run: go mod verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Type check
        run: cd ui && npx tsc --noEmit

      # Frontend complexity/coupling/layering gate (#816), the analog of the Go
      # golangci-lint job. Error-level rules (complexity <= 10,
      # cognitive-complexity <= 15, import cycles) fail the build; warning-level
      # rules (size/fan-out proxies) do not affect the exit code. Existing
      # error-level violations are ratcheted via ui/eslint-suppressions.json, so
      # only NEW violations fail — mirroring golangci-lint's only-new-issues.
      - name: Lint
        run: cd ui && npm run lint

      - name: Unit tests
        run: cd ui && npm test

      - name: Build
        run: cd ui && npm run build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      # Interactive Playwright suite against the MSW-mocked vite dev server
      # (the playwright config starts it via webServer), so no backend or
      # database services are required.
      - name: Run interactive E2E suite
        run: cd ui && npm run test:e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.6'
          repo-checkout: false

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/golang
            .semgrep/
