# Nightly real-dependency E2E (issue #896) and the full acceptance suite (#2218).
#
# The product's core value is cross-service enrichment, yet CI otherwise proves
# it only against mocks and in-memory middleware tests. The e2e job stands up
# the real dependency stack (PostgreSQL, Trino, SeaweedFS) from
# docker-compose.e2e.yml and runs the integration-tagged suites in test/e2e.
# The semantic layer is the platform's own catalog in PostgreSQL, so every
# suite runs against real services.
#
# Each acceptance criterion in test/acceptance used to run during its own
# ticket and never again, so a later change that broke an earlier ticket's
# behavior shipped unseen (#2205, #2216). The acceptance jobs run every
# criterion against the dev stack each night: one job per environment in
# test/acceptance/environments.txt and one for the plain stack, the matrix
# held to that file by TestEveryAcceptanceEnvironmentRunsNightly. The run's
# conclusion is every job's, which is what the release tag rules read
# (scripts/release-tag.py): a red night refuses a final tag.
name: E2E Nightly

on:
  schedule:
    # 07:00 UTC daily — a low-traffic hour for the shared runners.
    - cron: "0 7 * * *"
  workflow_dispatch:

# A slow nightly run must never pile up behind itself.
concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Real-dependency E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      # A digest the docs pin is checked by nothing else, and three that did
      # not exist shipped in the deployment guide (#2224). It asks the
      # registries, so it runs here rather than in verify.
      - name: Resolve the image digests the docs pin
        run: make docs-images-check

      - name: Start E2E environment
        run: make e2e-up

      # The output is kept for the report job, which names the failing tests
      # on the tracking issue. bash -o pipefail keeps tee from hiding the test
      # exit code.
      - name: Run E2E tests
        shell: bash
        run: make e2e-test 2>&1 | tee nightly-output-e2e.txt

      - name: Keep the test output for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-output-e2e
          path: nightly-output-e2e.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Collect compose logs
        if: always()
        # `make e2e-logs` follows (-f) and would hang a CI step, so capture a
        # non-following snapshot directly. DOCKER_DEFAULT_PLATFORM is cleared to
        # match the Makefile's E2E_COMPOSE (native platform for multi-arch images).
        env:
          DOCKER_DEFAULT_PLATFORM: ""
        run: docker compose -f docker-compose.e2e.yml logs --no-color > e2e-compose-logs.txt 2>&1 || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose-logs
          path: e2e-compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down E2E environment
        if: always()
        run: make e2e-down

  # The plain stack's criteria run in eight groups at once, split by ticket
  # number, each job on a stack of its own (#2218): one after another they run
  # for well over an hour, and the tag check waits on this workflow. Each other
  # environment in test/acceptance/environments.txt is one job.
  acceptance:
    name: Acceptance (${{ matrix.environment }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {environment: dev, shard: 1/8, id: dev-1}
          - {environment: dev, shard: 2/8, id: dev-2}
          - {environment: dev, shard: 3/8, id: dev-3}
          - {environment: dev, shard: 4/8, id: dev-4}
          - {environment: dev, shard: 5/8, id: dev-5}
          - {environment: dev, shard: 6/8, id: dev-6}
          - {environment: dev, shard: 7/8, id: dev-7}
          - {environment: dev, shard: 8/8, id: dev-8}
          - {environment: worker-off, shard: "", id: worker-off}
          - {environment: clickstack, shard: "", id: clickstack}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      # The portal the binary embeds is built on the Node major the frontend
      # is tested on (#1976).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # dev/start.sh runs each replica under air.
      - name: Install air
        run: go install github.com/air-verse/air@v1.64.5

      # The criteria that hold the .semgrep/ rules to their fixtures run the
      # tool make verify runs (#2275).
      - name: Install semgrep
        if: matrix.environment == 'dev'
        run: pipx install semgrep==1.151.0

      - name: Install the portal's dependencies and its test browser
        run: |
          npm ci --prefix ui
          cd ui && npx playwright install --with-deps chromium

      # release-acceptance.sh starts the dev stack with the environment's
      # settings, starts what the environment runs beside it, runs its
      # criteria, and stops what it started.
      - name: Run the acceptance suite
        shell: bash
        env:
          ACCEPTANCE_ENV: ${{ matrix.environment }}
          ACCEPTANCE_SHARD: ${{ matrix.shard }}
          ACCEPTANCE_TIMEOUT: 75m
        run: bash scripts/release-acceptance.sh 2>&1 | tee nightly-output-acceptance-${{ matrix.id }}.txt

      - name: Keep the test output for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-output-acceptance-${{ matrix.id }}
          path: nightly-output-acceptance-${{ matrix.id }}.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the stack's logs and the run's evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-logs-${{ matrix.id }}
          path: |
            build/release/
            build/acceptance/
            build/acceptance.jsonl
          if-no-files-found: warn
          retention-days: 14

  # A red night opens (or comments on) the one tracking issue, and a green one
  # closes it (#2036): a failure nobody reads is how the suite stayed red for
  # three weeks. One job reports for every job above, so a passing job never
  # closes the issue another job's failure opened. Only main's runs report; a
  # cancelled run says nothing about the suite.
  report:
    name: Report to the tracking issue
    needs: [e2e, acceptance]
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gather every job's test output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-output-*
          path: nightly-output
          merge-multiple: true

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ (needs.e2e.result == 'success' && needs.acceptance.result == 'success') && 'success' || 'failure' }}
        run: |
          cat nightly-output/*.txt > nightly-output.txt 2>/dev/null || true
          python3 scripts/e2e_nightly.py report "$OUTCOME" nightly-output.txt
