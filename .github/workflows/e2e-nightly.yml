# Nightly real-dependency E2E (issue #896).
#
# The product's core value is cross-service enrichment, yet CI otherwise proves
# it only against mocks and in-memory middleware tests. This workflow stands up
# the real dependency stack (PostgreSQL, Trino, SeaweedFS) from
# docker-compose.e2e.yml and runs the integration-tagged suites in test/e2e.
# The semantic layer is the platform's own catalog in PostgreSQL, so every
# suite runs against real services.
name: E2E Nightly

on:
  schedule:
    # 07:00 UTC daily — a low-traffic hour for the shared runners.
    - cron: "0 7 * * *"
  workflow_dispatch:

# A slow nightly run must never pile up behind itself.
concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Real-dependency E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # the tracking issue a red night opens
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Start E2E environment
        run: make e2e-up

      # The output is kept for the report below, which names the failing
      # tests on the tracking issue. bash -o pipefail keeps tee from hiding
      # the test exit code.
      - name: Run E2E tests
        id: tests
        shell: bash
        run: make e2e-test 2>&1 | tee e2e-test-output.txt

      # A red night opens (or comments on) the one tracking issue, and a green
      # one closes it (#2036): a failure nobody reads is how the suite stayed
      # red for three weeks. Only main's runs report; a cancelled run says
      # nothing about the suite.
      - name: Report to the tracking issue
        if: (success() || failure()) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: python3 scripts/e2e_nightly.py report "$OUTCOME" e2e-test-output.txt

      - name: Collect compose logs
        if: always()
        # `make e2e-logs` follows (-f) and would hang a CI step, so capture a
        # non-following snapshot directly. DOCKER_DEFAULT_PLATFORM is cleared to
        # match the Makefile's E2E_COMPOSE (native platform for multi-arch images).
        env:
          DOCKER_DEFAULT_PLATFORM: ""
        run: docker compose -f docker-compose.e2e.yml logs --no-color > e2e-compose-logs.txt 2>&1 || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose-logs
          path: e2e-compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down E2E environment
        if: always()
        run: make e2e-down
