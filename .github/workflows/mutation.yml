name: Mutation Testing

# Mutation testing (gremlins) is too slow for a per-commit gate, so it does not
# run in CI on push/PR. It runs weekly here and on demand via workflow_dispatch.
# A failing run does not block any merge (a scheduled job cannot); its red/green
# history is the signal. Locally the same check runs in `make verify-release`.
on:
  schedule:
    # Weekly, Sunday 08:00 UTC (low-traffic window).
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Mutation testing over ./pkg/... and ./internal/... is expensive; cap the
    # run generously (a job may run up to six hours).
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Install gremlins
        # Keep this version in sync with GREMLINS_VERSION in the Makefile.
        run: scripts/go-install.sh github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # pkg/ and internal/ (#2732): internal/ holds most of the code the
      # security-design rules are about, and the run used to read pkg/ alone.
      - name: Run mutation testing
        run: make mutate MUTATE_PKGS="./pkg/... ./internal/..."

  # Every scheduled workflow reports its result (#2730).
  # The verdict goes to the "<workflow> is failing" issue (#2730): opened or
  # commented on when the run failed, closed when it passed. Main only, on
  # success and failure; a cancelled run says nothing. issues: write is this
  # job's alone.
  report:
    name: Report to the tracking issue
    needs: [mutation]
    if: (success() || failure()) && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: python3 scripts/scheduled_report.py report "$OUTCOME"
