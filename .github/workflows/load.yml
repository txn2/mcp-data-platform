# Load-test workflow (issue #921).
#
# Two jobs:
#   - harness: build, vet, lint, and unit-test the test/load module. Cheap and
#     deterministic; the real regression guard for the harness code itself.
#   - smoke:   stand up the compose stack (Postgres/Trino/SeaweedFS, the
#     same stack as e2e-nightly) and run each scenario at a short smoke scale, uploading
#     the JSON reports as an artifact.
#
#   - endpoint-latency: one scenario on a runner of its own, holding an endpoint
#     to a stated p99 bound (#2544).
#
# GitHub runners are noisy shared hardware, so the smoke numbers are INDICATIVE
# ONLY and are never the published reference numbers (those live in
# docs/reference/tuning-and-scaling.md, measured on a stated environment). The
# smoke job gates on the scenarios' functional assertions (error rate, drop
# behavior) — loadgen exits non-zero when they fail — not on throughput
# thresholds, which would flake on shared runners.
#
# Manual (workflow_dispatch) plus a weekly schedule. A pull request that
# changes test/load or this workflow runs the harness job alone (#2729): the
# module is separate from the root one, so nothing else on a pull request
# builds, vets, tests or lints it, and a lint finding from #2544 reached main
# and failed every weekly run after. `make verify` runs the same checks
# (load-test, load-lint). The scenarios are not part of `make verify`.
name: Load Test

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC Mondays — after the weekly mutation run, low-traffic hour.
    - cron: "0 8 * * 1"
  pull_request:
    paths:
      - "test/load/**"
      - ".github/workflows/load.yml"

concurrency:
  # A pull request's run is its own; the scheduled and dispatched runs on main
  # share one group so two never load one another's runner pool at once.
  group: load-test-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  harness:
    name: Harness module checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: test/load/go.sum

      - name: Build, vet, and test the harness
        run: make load-test

      - name: Lint the harness
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: test/load

  smoke:
    name: Load smoke (indicative)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOAD_KEY: load-admin-key
      LOAD_CONFIG: test/load/config/platform.load-ci.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Start stack and platform
        run: make load-up

      - name: Run scenarios (smoke scale)
        run: |
          set -e
          for s in mcp-session-churn mcp-tool-call portal-read audit-burst oauth-token; do
            echo "::group::scenario $s"
            make load-run SCENARIO="$s" CONCURRENCY=4 DURATION=8s WARMUP=2s
            echo "::endgroup::"
          done

      - name: Upload load reports (indicative)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-reports
          path: build/load-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Collect platform log
        if: always()
        run: cat build/mcp-data-platform-load.log || true

      - name: Tear down
        if: always()
        run: make load-down

  # An authenticated endpoint at 200 requests a second, five statements each on
  # an application database with the statement cache on (#2544). The scenario is
  # this job's only work and the runner is its own, with two databases and the
  # platform on it: no Trino, object store or indexer competes with the requests
  # measured, which on a shared acceptance runner is what the percentile read.
  #
  # ENDPOINT_P99_BOUND_MS is the bound, chosen from five runs of this job on
  # main (#2544):
  #
  #   run           date        commit     p50     p99
  #   42670550224   2026-11-09  8ae5f9f0d  -       9.1 ms
  #   43921248338   2026-11-16  32b79f616  -      14.2 ms
  #   44652552404   2026-11-20  8b91e56d6  2.5 ms  8.5 ms
  #   44653368352   2026-11-20  8b91e56d6  2.5 ms  8.2 ms
  #   44654020057   2026-11-20  8b91e56d6  3.9 ms 11.7 ms
  #
  # Every request of every run succeeded. 30 ms is about twice the slowest of
  # the five, so a runner's noise does not fail it and a change that doubles
  # the tail does. The same load inside the shared acceptance runner reads
  # 15 to 238 ms on one code, which is why the bound lives here and not there.
  endpoint-latency:
    name: Endpoint latency
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOAD_KEY: load-admin-key
      ENCRYPTION_KEY: 58ebbd3d1ca6c9b7a855e755fffb25ab3d2c0c644ec629e796a91283ea53e891
      ENDPOINT_P99_BOUND_MS: "30"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Start the databases and the platform
        run: make load-endpoint-up

      - name: Run the scenario
        run: make load-run SCENARIO=endpoint-appdb

      - name: Write the percentiles to the job summary
        if: always()
        run: python3 scripts/load-endpoint-summary.py build/load-reports/report-endpoint-appdb.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endpoint-latency-report
          path: build/load-reports/**
          if-no-files-found: warn
          retention-days: 90

      - name: Collect platform log
        if: always()
        run: cat build/mcp-data-platform-load.log || true

      - name: Tear down
        if: always()
        run: make load-down

  # Load failed every week from August to November unnoticed (#2729).
  # The verdict goes to the "<workflow> is failing" issue (#2730): opened or
  # commented on when the run failed, closed when it passed. Main only, on
  # success and failure; a cancelled run says nothing. issues: write is this
  # job's alone.
  report:
    name: Report to the tracking issue
    needs: [harness, smoke, endpoint-latency]
    if: (success() || failure()) && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: python3 scripts/scheduled_report.py report "$OUTCOME"
