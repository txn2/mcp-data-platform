        type: string
      id:
        example: 9b1c0f26-1a3e-4c5f-9d0b-2f7a6e5c4d31
        type: string
      kind:
        example: sql
        type: string
      method:
        description: Method, Path and OperationID are the request line, on an api
          record.
        example: GET
        type: string
      operation_id:
        example: listOrders
        type: string
      outcome:
        description: Outcome is derived on every read; see the package comment.
        example: satisfied
        type: string
      path:
        example: /v1/orders
        type: string
      persona:
        example: data-engineer
        type: string
      promoted_at:
        type: string
      promoted_by:
        example: marcus.johnson@example.com
        type: string
      promoted_urn:
        example: urn:li:query:abc123
        type: string
      purpose:
        description: Purpose is the reason the caller stated for making the call (#1317).
        example: Sizing Q3 revenue by region for the board deck.
        type: string
      reference:
        description: Reference is EventID in the form an agent cites.
        example: mcp:call:a1b2c3d4e5f6g7h8
        type: string
      rejected_at:
        type: string
      rejected_by:
        example: marcus.johnson@example.com
        type: string
      rejection_note:
        type: string
      response_chars:
        example: 2450
        type: integer
      reuse_count:
        description: |-
          ReuseCount is how many later sessions fetched this record and then ran
          what it holds. It is the only signal on a record that a stranger, and
          not its author, found it worth running.
        example: 2
        type: integer
      satisfied_by:
        description: |-
          SatisfiedBy names the route that satisfied the record (asset, export,
          capture). Empty on every other outcome.
        example: capture
        type: string
      session_id:
        example: dps_9f2c1a4b8e7d6c5a
        type: string
      statement:
        description: Statement is the SQL text, on a sql record.
        type: string
      success:
        example: true
        type: boolean
      targets:
        description: |-
          Targets are what the call addressed: DataHub dataset URNs parsed from
          the SQL, or the endpoint identity for an API call. Sorted and
          deduplicated, so two records over the same tables compare equal.
        items:
          type: string
        type: array
      tool_name:
        example: trino_query
        type: string
      user_email:
        example: marcus.johnson@example.com
        type: string
      user_id:
