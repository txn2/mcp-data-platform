host: localhost:8080
info:
  contact: {}
  description: REST API for the MCP Data Platform. Covers admin endpoints (system,
    config, personas, auth keys, audit, knowledge, memory, connections), portal endpoints
    (assets, collections, shares, prompts, activity), and resource management.
  title: MCP Data Platform API
  version: "1.0"
paths:
  /admin/api-catalogs:
    get:
      description: Returns all API catalogs with derived spec_count and ref_count
        fields.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalogapi.catalogResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List API catalogs
      tags:
      - API Catalogs
    post:
      consumes:
      - application/json
      description: Creates a new API catalog. Only available in database config mode.
      parameters:
      - description: Catalog definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalogapi.createCatalogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/catalogapi.catalogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create API catalog
      tags:
      - API Catalogs
  /admin/api-catalogs/{id}:
    delete:
      description: Deletes a catalog. Rejected with 409 if any connection still references
        it.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpjson.StatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete API catalog
      tags:
      - API Catalogs
    get:
      description: Returns a single API catalog by ID with derived spec_count and
        ref_count fields.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalogapi.catalogResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get API catalog
      tags:
      - API Catalogs
    put:
      consumes:
      - application/json
      description: Applies a partial edit to a catalog and reloads dependent api-gateway
        connections.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: string
      - description: Catalog fields to update
        in: body
        name: body
        required: true
