    properties:
      attempt:
        type: integer
      created_at:
        type: string
      duration_ms:
        example: 1840
        type: integer
      error:
        description: |-
          Error is why a failed run failed, carried into the listing because a
          history whose failures say only "failed" sends every reader to the detail
          view to learn the same thing.
        type: string
      finished_at:
        type: string
      fire_time:
        type: string
      id:
        example: run_a1b2c3d4
        type: string
      log:
        description: |-
          Log is the run's own account of itself, bounded at capture time, so
          returning it whole is bounded too.
        type: string
      log_truncated:
        type: boolean
      metrics:
        $ref: '#/definitions/script.RunMetrics'
      output_count:
        description: |-
          OutputCount counts what the run persisted. It is deliberately not called
          "outputs": the run detail carries the outputs themselves under that name,
          and one field meaning a count in one payload and a list in another is how
          a client ends up rendering "3" where a link belongs.
        example: 1
        type: integer
      outputs:
        items:
          $ref: '#/definitions/script.RunOutput'
        type: array
      params:
        additionalProperties: {}
        type: object
      requested_by:
        description: |-
          RequestedBy is who asked for the run, empty for a scheduled one, which
          nobody requested.
        example: jane@example.com
        type: string
      scheduled_for:
        type: string
      script_id:
        type: string
      started_at:
        type: string
      status:
        example: succeeded
        type: string
      trigger:
        example: schedule
        type: string
      version:
        example: 3
        type: integer
    type: object
  scripthttp.portalRunListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/scripthttp.portalRun'
        type: array
      total:
        example: 12
        type: integer
    type: object
  scripthttp.portalScriptListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/scripthttp.portalScriptRow'
        type: array
      total:
        example: 3
        type: integer
    type: object
  scripthttp.portalScriptResponse:
    properties:
      contract:
        $ref: '#/definitions/script.Contract'
      draft_params:
        description: |-
          DraftParams is the LIVE record's parameter contract, which is not always
          the contract above only in freshness: it is read with the source, so the
          dry-run form binds against exactly the contract the code beside it was
          written against (#1364). It travels with the source for the same
          audience and for the same reason.
        items:
          $ref: '#/definitions/script.Param'
        type: array
      owned:
        example: true
        type: boolean
      source:
        description: |-
          Source is the live script's code, present only for the owner and an
          administrator: it is what the editor on that page opens (#1307). The
          contract document deliberately does not carry it, because that document
          is what a reference to the script resolves to.
        type: string
    type: object
  scripthttp.portalScriptRow:
    properties:
      last_run:
        allOf:
        - $ref: '#/definitions/scripthttp.portalRun'
        description: |-
          LastRun is the most recent run of this script, absent when it has never
          run and when the caller does not own it — a run is owner-and-admin
          reading, and so is the fact that one failed.
      owned:
        description: |-
          Owned reports whether this caller may read the script's runs and source,
          so the page offers those surfaces rather than linking a reader to a
          refusal.
        example: true
        type: boolean
      schedule:
        allOf:
        - $ref: '#/definitions/script.Schedule'
        description: |-
          Schedule is the script's cadence, absent when it has none. On a row this
          caller does not own it carries the cadence alone (see reportableSchedule).
      script:
        $ref: '#/definitions/script.Script'
    type: object
  scripthttp.portalScriptRun:
    properties:
      duration_ms:
        example: 1840
        type: integer
      error:
        description: |-
          Error is why a failed run failed, carried into the listing because a
          history whose failures say only "failed" sends every reader to the detail
          view to learn the same thing.
        type: string
      finished_at:
        type: string
      fire_time:
        type: string
      id:
        example: run_a1b2c3d4
        type: string
      output_count:
        description: |-
          OutputCount counts what the run persisted. It is deliberately not called
          "outputs": the run detail carries the outputs themselves under that name,
          and one field meaning a count in one payload and a list in another is how
          a client ends up rendering "3" where a link belongs.
        example: 1
        type: integer
      requested_by:
        description: |-
          RequestedBy is who asked for the run, empty for a scheduled one, which
          nobody requested.
        example: jane@example.com
        type: string
      script_id:
        example: script_a1b2c3d4
        type: string
      script_name:
        description: |-
          ScriptName is the script's display name, falling back to its name. It is
          empty only for a run whose script is outside the listing this answer
          resolved names from, and a client shows the id in that case.
        example: Daily Sales Report
        type: string
      started_at:
        type: string
      status:
        example: succeeded
        type: string
      trigger:
        example: schedule
        type: string
      version:
        example: 3
        type: integer
    type: object
  scripthttp.referenced:
    properties:
      capabilities:
        items:
          type: string
        type: array
      connections:
        items:
          type: string
        type: array
      destinations:
        description: |-
          Destinations are where this version's OUTPUTS go: the names
          platform.export writes to, with the portal counted for any export that
          names none. It is not every byte the script can move — a write made
          through platform.call is read in Tools instead.
        items:
          type: string
        type: array
      dynamic_connections:
        description: |-
          DynamicConnections is true when at least one call computes its connection
          instead of naming one, DynamicDestinations when one computes its
          destination, and DynamicRefreshTargets when a publish_data call computes
          the name it refreshes. Any of them makes that list incomplete.
        type: boolean
      dynamic_destinations:
        type: boolean
      dynamic_refresh_targets:
        type: boolean
      dynamic_tools:
        description: |-
          DynamicTools is true when a platform.call computes the tool it invokes,
          which shortens the tool list. A computed argument set shortens the
          connection list instead.
        type: boolean
      refresh_targets:
        description: |-
          RefreshTargets are the output names platform.publish_data refreshes, so
          a reader sees which asset's data region this script rewrites.
        items:
          type: string
        type: array
      tools:
        description: |-
          Tools are the tool names the source passes to platform.call literally.
          The persona filter decides what a run MAY call; this is what this version
          DOES call (#1419).
        items:
          type: string
        type: array
    type: object
  scripthttp.runRequest:
    properties:
      params:
        additionalProperties: {}
        type: object
    type: object
  scripthttp.runResponse:
    properties:
      message:
        description: Message states what was queued, in the owner's terms.
        type: string
      run_id:
        example: run_a1b2c3d4
        type: string
      status:
        example: pending
        type: string
      version:
        example: 3
        type: integer
    type: object
  scripthttp.scheduleListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/script.Schedule'
        type: array
      total:
        example: 2
        type: integer
    type: object
  scripthttp.scheduleRequest:
    properties:
      cron:
        description: Cron is a standard five-field expression or a descriptor (@daily).
        example: 0 7 * * 1-5
        type: string
      enabled:
        description: |-
          Enabled turns the schedule on or off; omitted leaves an existing
          schedule's state alone and starts a new one enabled.
        type: boolean
      params:
        additionalProperties: {}
        description: |-
          Params are the values every fire binds, with ${fire_date} left as
          written: it expands at the fire, so the run records the date it computed.
        type: object
      timezone:
        description: Timezone is the IANA zone the expression is read in; empty means
          UTC.
        example: America/Los_Angeles
        type: string
    type: object
  scripthttp.scriptListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/script.Script'
        type: array
      total:
        example: 3
        type: integer
    type: object
  scripthttp.sourceRequest:
    properties:
      source:
        type: string
    type: object
  scripthttp.sourceResponse:
    properties:
      applied:
        description: |-
          Applied is true when the live script now carries this source, which is
          every successful save.
        example: true
        type: boolean
      message:
        description: Message states the outcome in the owner's terms.
        example: Saved, and this version is what runs now.
        type: string
    type: object
  scripthttp.validateResponse:
    properties:
      capabilities:
        description: |-
          Capabilities, Connections and Destinations are what the code plainly
          reaches. They are the reviewer's diff material, shown to the author first
          so the capability change is theirs to notice rather than a surprise in
          somebody else's queue.
        items:
          type: string
        type: array
      connections:
        items:
          type: string
        type: array
      destinations:
        description: |-
          Destinations are where this source's OUTPUTS go, which is not every byte
          it can move: a write made through platform.call is read in Tools.
        items:
          type: string
        type: array
      dynamic_connections:
        description: |-
          DynamicConnections, DynamicDestinations and DynamicRefreshTargets report
          that a list above is known to be incomplete because a call computes its
          target instead of naming one. Reporting the gap is the point: a list that
          silently omitted a computed name would be a false statement.
        type: boolean
      dynamic_destinations:
        type: boolean
      dynamic_refresh_targets:
        type: boolean
      dynamic_tools:
        type: boolean
      findings:
        items:
          $ref: '#/definitions/scriptrun.Finding'
        type: array
      note:
        description: Note states any such gap in the author's terms.
        type: string
      ok:
        example: true
        type: boolean
      refresh_targets:
        description: |-
          RefreshTargets are the output names platform.publish_data refreshes, so
          the author sees which asset's data region the edit rewrites.
        items:
          type: string
        type: array
      tools:
        description: |-
          Tools are the tool names the edit passes to platform.call literally, so
          the author sees the reach of the open half of the surface before a run
          exercises it (#1419).
        items:
          type: string
        type: array
    type: object
  scripthttp.versionDetailResponse:
    properties:
      dry_run:
        allOf:
        - $ref: '#/definitions/script.DryRun'
        description: |-
          DryRun is the account of somebody having executed this exact source, and
          what it did (#1364). It is absent when nobody has.
      findings:
        description: Findings are the validator's complaints about the source.
        items:
          $ref: '#/definitions/scriptrun.Finding'
        type: array
      referenced:
        allOf:
        - $ref: '#/definitions/scripthttp.referenced'
        description: |-
          Referenced is what a static read of the source says the script calls,
          which connections it names, and where it writes.
      version:
        $ref: '#/definitions/script.Version'
    type: object
  scripthttp.versionListResponse:
    properties:
