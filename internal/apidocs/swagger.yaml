  /admin/calls:
    get:
      description: 'Returns every data-access call the platform recorded, newest first:
        each query and API invocation with the purpose stated for it, the outcome
        derived from what was built from it, and how many later sessions re-ran it.
        Set queue=promotable for the review queue, which keeps the records that answered
        something and orders them by reuse first.'
      parameters:
      - description: Filter to one caller's calls
        in: query
        name: user_id
        type: string
      - description: Filter by call kind (sql, api)
        in: query
        name: kind
        type: string
      - description: Filter by connection name
        in: query
        name: connection
        type: string
      - description: Filter by outcome (failed, satisfied, superseded, ran)
        in: query
        name: outcome
        type: string
      - description: Filter by a dataset URN or endpoint the call addressed
        in: query
        name: target
        type: string
      - description: Filter to one session's calls
        in: query
        name: session_id
        type: string
      - description: Match the purpose or the statement
        in: query
        name: q
        type: string
      - description: Set to 'promotable' for the review queue
        in: query
        name: queue
        type: string
      - description: 'Page number, 1-based (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Results per page (default: 25, max: 200)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_txn2_mcp-data-platform_internal_admin_callapi.callListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List recorded calls
      tags:
      - Calls
