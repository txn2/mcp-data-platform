  admin.effectiveConnection:
    properties:
      config:
        additionalProperties: {}
        type: object
      connection:
        example: acme-warehouse
        type: string
      created_by:
        example: admin@example.com
        type: string
      description:
        example: Production data warehouse
        type: string
      file_declared:
        description: 'FileDeclared marks a connection the platform configuration file
          declares, which cannot be deleted through this API. Source cannot answer
          it: the connection backfill gives a file-configured connection a stored
          row too, so it reports "both" as well.'
        example: true
        type: boolean
      health:
        $ref: '#/definitions/toolkit.ConnectionHealthWire'
      kind:
        example: trino
        type: string
      name:
        example: acme-warehouse
        type: string
      source:
        description: '"file", "database", or "both"'
        example: file
        type: string
      tools:
        example:
        - trino_query
        - trino_describe_table
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  admin.embeddingProviderStatusResponse:
    properties:
      dimension:
        description: Dimension is the embedding vector length.
        example: 768
        type: integer
      kind:
        description: |-
          Kind is the provider implementation identifier: "ollama", "noop",
          or a future kind. Empty string when no provider was wired.
        example: ollama
        type: string
      model:
        description: |-
          Model identifies the underlying embedding model when the provider
          exposes it (e.g., "nomic-embed-text" for Ollama). Empty for
          providers whose backend has no model concept (noop).
        example: nomic-embed-text
        type: string
      status:
        description: |-
          Status is the operator-visible health enum:
            - "ok": a real provider is configured; semantic features active.
            - "unconfigured": no provider configured (or noop placeholder).
              Semantic ranking falls back to lexical; memory writes persist
              with Embedding: nil.
        example: ok
        type: string
    type: object
  admin.enrichmentRuleBody:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      enrich_action:
        $ref: '#/definitions/enrichment.Action'
      merge_strategy:
        $ref: '#/definitions/enrichment.Merge'
      tool_name:
        type: string
      when_predicate:
        $ref: '#/definitions/enrichment.Predicate'
    type: object
  admin.failedUnitResponse:
    properties:
      attempts:
        type: integer
      first_failed_at:
        type: string
      last_error:
        type: string
      last_failed_at:
        type: string
      last_succeeded_at:
        description: |-
          LastSucceededAt is the unit's most recent success, omitted when it
          has never succeeded, so the UI can show "last succeeded Xm ago".
        type: string
      latest_job_id:
        description: |-
          LatestJobID is the row the UI drills into for the un-redacted
          error and the job's timeline.
        type: integer
      occurrences:
        description: |-
          Occurrences is how many open failed rows the unit has (>1 means it
          failed, was retried, and failed again without an intervening
          success).
        type: integer
      parked_until:
        description: |-
          ParkedUntil is when the periodic gap sweep will re-queue this unit
          again, omitted while it is not deferred. Present means the platform
          has stopped re-queueing the unit every reconcile tick because it
          keeps failing without ever succeeding; a source write or an operator
          reindex still runs it immediately.
        type: string
      source_id:
        type: string
      source_kind:
        type: string
    type: object
  admin.indexCoverageResponse:
    properties:
      expected:
        type: integer
      expected_known:
        type: boolean
      indexed:
        type: integer
    type: object
  admin.indexJobResponse:
    properties:
      attempts:
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      id:
        type: integer
      items_done:
        type: integer
      last_error:
        type: string
      lease_expires_at:
        type: string
      next_run_at:
        type: string
      source_id:
        type: string
      source_kind:
        type: string
      started_at:
        type: string
      status:
        type: string
      trigger:
        type: string
      worker_id:
        type: string
    type: object
  admin.indexJobsSummaryResponse:
    properties:
      kinds:
        description: |-
          Kinds is one summary row per registered index_jobs consumer,
          sorted by kind. Empty when no queue is wired (no database or no
          configured provider) or no consumer registered.
        items:
          $ref: '#/definitions/admin.indexKindSummary'
        type: array
      provider:
        allOf:
        - $ref: '#/definitions/admin.embeddingProviderStatusResponse'
        description: |-
          Provider is the embedding-provider health (configured / model /
          dimension / status). A degraded provider makes every index
          meaningless, so the dashboard shows it as a banner.
    type: object
  admin.indexKindSummary:
    properties:
      coverage:
        allOf:
        - $ref: '#/definitions/admin.indexCoverageResponse'
        description: |-
          Coverage is the indexed-vs-expected rollup, omitted for kinds
          whose Sink reports none.
      failed:
        description: |-
          Failed is the number of units carrying an open failed job: the
          same population the failure-triage list holds, and the verdict's
          "degraded" signal. It is not a latest-status count, because a
          failing unit is re-queued and its latest status is pending; a
          unit is counted under both while its retry is queued.
        type: integer
      kind:
        type: string
      last_activity:
        description: |-
          LastActivity is the most recent job's activity timestamp
          (completed, else started, else created), RFC3339, omitted when
          the kind has no jobs yet (e.g. vectors seeded outside the queue).
          The UI renders recency from this; its absence means "no job has
          run", which on a fully-indexed kind reads as up to date, not
          "never".
        type: string
      pending:
        type: integer
      running:
        type: integer
      succeeded:
        description: |-
          Pending / Running / Succeeded are per-unit latest-status counts
          ("N units whose last run was X"), NOT job counts. The UI labels
          them as such so "1 succeeded" no longer reads as a one-job
          history.
        type: integer
      verdict:
        description: |-
          Verdict is the plain-language health state the dashboard leads
          with: "healthy", "indexing", or "degraded". Computed server-side
          from counts + coverage so the UI renders one word instead of
          reconciling three independent metric families. "healthy" is the
          single resting state for any fully-indexed, quiescent, failure-free
          kind regardless of job history; recency is carried by LastActivity.
        type: string
    type: object
  admin.insightListResponse:
    properties:
