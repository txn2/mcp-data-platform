  persona.APIRouteRule:
    properties:
      action:
        description: |-
          Action is "allow" (default) or "deny". Deny rules take precedence
          over allow rules within the matching-Connection subset.
        type: string
      connection:
        description: |-
          Connection is a glob (e.g. "crm-*") matched against the connection
          name. Required.
        type: string
      methods:
        description: |-
          Methods is a list of HTTP method globs (e.g. ["GET", "HEAD"]).
          Empty = any method. Patterns are case-sensitive — typically
          uppercase ("GET", "POST", etc.) since the toolkit normalizes
          inbound methods to uppercase before this check runs.
        items:
          type: string
        type: array
      paths:
        description: |-
          Paths is a list of path globs. Each is matched against both the
          path a call reaches ("/v1/orders/42") and the catalog template it
          resolved from ("/v1/orders/{id}"), so a rule may name either form:
          the templated path an operation is listed under governs the calls
          that operation serves, and a glob written by hand still governs a
          path no catalog declares. Empty = any path.
        items:
          type: string
        type: array
    type: object
