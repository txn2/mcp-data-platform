  /portal/calls:
    get:
      description: 'Returns the calling user''s own data-access calls, newest first:
        every query and API invocation the platform recorded, with the purpose stated
        for it and the outcome derived from what was built from it. There is no user
        parameter; the listing is always the caller''s own.'
      parameters:
      - description: Filter by call kind (sql, api)
        in: query
        name: kind
        type: string
      - description: Filter by connection name
        in: query
        name: connection
        type: string
      - description: Filter by outcome (failed, satisfied, superseded, ran)
        in: query
        name: outcome
        type: string
      - description: Filter by a dataset URN or endpoint the call addressed
        in: query
        name: target
        type: string
      - description: Filter to one session's calls
        in: query
        name: session_id
        type: string
      - description: Match the purpose or the statement
        in: query
        name: q
        type: string
      - description: Set to 'promotable' for the records awaiting promotion, most
          reused first
        in: query
        name: queue
        type: string
      - description: 'Page number, 1-based (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Results per page (default: 25, max: 200)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_txn2_mcp-data-platform_internal_portal_callapi.callListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpjson.ProblemDetail'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List my calls
      tags:
      - Calls
  /portal/calls/{id}:
    get:
      description: 'Returns one of the caller''s own call records: the statement or
        request line, the purpose stated for it, its outcome and how it was reached,
        the assets and captures built from it, and how many later sessions re-ran
        it. A record id belonging to another user is not found, the same answer an
        id that was never used gets.'
