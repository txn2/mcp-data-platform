  admin.personaCreateRequest:
    properties:
      agent_instructions_override:
        type: string
      agent_instructions_suffix:
        type: string
      allow_connections:
        items:
          type: string
        type: array
      allow_tools:
        example:
        - datahub_*
        items:
          type: string
        type: array
      api_routes:
        description: |-
          APIRoutes replaces the persona's API route rules wholesale. Absent
          leaves the persona with none, which is the same "no rule touches this
          connection" state a persona that never had any is in.
        items:
          $ref: '#/definitions/persona.APIRouteRule'
        type: array
      deny_connections:
        items:
          type: string
        type: array
      deny_tools:
        items:
          type: string
        type: array
      description:
        example: Read-only access to DataHub
        type: string
      description_override:
        type: string
      description_prefix:
        type: string
      display_name:
        example: Data Viewer
        type: string
      name:
        example: viewer
        type: string
      priority:
        example: 0
        type: integer
      roles:
        example:
        - viewer
        items:
          type: string
        type: array
    type: object
  admin.personaDetail:
    properties:
      allow_connections:
        items:
          type: string
        type: array
      allow_tools:
        example:
        - trino_*
        - datahub_*
        - s3_*
        items:
          type: string
        type: array
      api_routes:
        description: |-
          APIRoutes are the persona's per-(connection, method, path) rules for
          api-kind connections. Ships as a JSON array, NEVER null: the persona
          editor's API-endpoint scope maps over it directly.
        items:
          $ref: '#/definitions/persona.APIRouteRule'
        type: array
      context:
        $ref: '#/definitions/admin.personaContextDetail'
      deny_connections:
        items:
          type: string
        type: array
      deny_tools:
        example:
        - trino_execute
        items:
          type: string
        type: array
      description:
        example: ETL pipeline development and schema management
        type: string
      display_name:
        example: Data Engineer
        type: string
      name:
        example: data-engineer
        type: string
      priority:
        example: 10
        type: integer
      roles:
        example:
        - data_engineer
        items:
          type: string
        type: array
      source:
        description: '"file", "database", or "both"'
        example: file
        type: string
      tools:
        example:
        - trino_query
        - trino_describe_table
        - datahub_search
        items:
