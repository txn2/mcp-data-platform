  assetrefapi.audience:
    properties:
      public:
        description: |-
          Public is true when an active link share exists, which is the reading
          that matters: a link share is readable by anyone who holds it, with no
          account at all.
        type: boolean
      shared_with_users:
        description: SharedWithUsers is true when the asset is shared with named people.
        type: boolean
    type: object
  assetrefapi.listResponse:
    properties:
      audience:
        $ref: '#/definitions/assetrefapi.audience'
      can_edit:
        description: |-
          CanEdit is this reader's authority over the list. The panel offers add
          and remove on it rather than re-deriving ownership in the browser, so
          the control a reader sees and the answer the route gives cannot differ.
        type: boolean
      content_scanned:
        description: |-
          ContentScanned reports whether the asset's stored content was read to
          find where it writes each URI. False means the occurrence lists say
          nothing at all: the content is binary, too large, or could not be read.

          It is a separate field rather than an inference from empty occurrences
          because the two mean opposite things to the person removing a reference.
          "The content does not name this" makes a removal safe; "we could not
          look" does not, and a client that could not tell them apart would
          withdraw a grant from a live report without a word.
        type: boolean
      data:
        items:
          $ref: '#/definitions/assetrefapi.refView'
        type: array
      max:
        description: |-
          Max is the per-asset reference cap, so the panel can say what the limit
          is before a caller hits it.
        type: integer
      notice:
        description: |-
          Notice is the sentence stating what a reference gives away, the same one
          the toolkit shows an agent at the moment it declares one.
        type: string
      total:
        type: integer
    type: object
  assetrefapi.occurrence:
    properties:
      line:
        description: Line is 1-indexed, counting the stored content's own lines.
        type: integer
      snippet:
        description: |-
          Snippet is the fragment of that line around the URI, whitespace
          collapsed, so the panel can show the reader what their content says.
        type: string
      truncated:
        description: |-
          Truncated is set on the last reported occurrence when the cap stopped
          the scan, so a warning built from this list reads as "at least these"
          rather than as the whole of them.
        type: boolean
    type: object
  assetrefapi.refView:
    properties:
      broken:
        description: |-
          Broken marks a reference whose resource has been deleted. The row
          survives the delete on purpose (#1474), so this is the one place the
          owner learns their report is now serving with a picture missing.
        type: boolean
      category:
        type: string
      content_url:
        description: |-
          ContentURL is the reference's own serving URL, the same one the rewrite
          writes into the content this reader is served. It is here so the panel
          can show a thumbnail through the grant the reference already makes,
          rather than through the resource route, which a reader of a shared asset
          may not be allowed to call.
        type: string
      declared_by:
        type: string
      description:
        type: string
      display_name:
        type: string
      filename:
        type: string
      mime_type:
        type: string
      occurrences:
        description: |-
          Occurrences names where the asset's stored content still writes this
          URI. Empty means the content does not name it -- either because it never
          did, or because the content could not be read; see scanOccurrences.
        items:
          $ref: '#/definitions/assetrefapi.occurrence'
        type: array
      position:
        type: integer
      readable:
        description: |-
          Readable is whether this reader could open the resource on its own, as
          opposed to through the asset. It decides whether the row is a link: a
          reader of a shared asset can see a file they have no direct access to,
          and a link to the resource's own page would only lead them to a
          not-found.
        type: boolean
      resource_id:
        type: string
      scope:
        type: string
      scope_id:
        type: string
      size_bytes:
        type: integer
      uri:
        type: string
    type: object
  assetrefapi.referencingAsset:
    properties:
      id:
        type: string
      name:
        type: string
      owner_email:
        type: string
      public:
        description: |-
          Public marks an asset carrying an active link share. It is the flag the
          whole list exists for: a reference carries the asset's audience, so a
          resource referenced by a publicly shared asset is readable by anyone who
          holds that link.
        type: boolean
    type: object
  assetrefapi.usedByResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/assetrefapi.referencingAsset'
        type: array
      hidden:
        description: |-
          Hidden counts the referencing assets this reader may not open. They are
          named nowhere, but they are counted: someone deciding whether to delete a
          file has to know the list they are looking at is not the whole of what
          would break.
        type: integer
      total:
        type: integer
      truncated:
        description: |-
          Truncated says the answer was cut at the bound rather than being the
          whole of what references this file. It is reported rather than left
          implicit for the reason Hidden is: a short list read as a complete one
          is the mistake this surface exists to prevent.
        type: boolean
    type: object
  attachhttp.AttachmentView:
    properties:
      attached_by:
        type: string
      broken:
        description: |-
          Broken marks an attachment whose resource was deleted. The row stays in
          the list so an author can see and remove the dangling link; without it a
          deleted template would simply vanish from the editor while the served
          prompt kept reporting a missing material.
        type: boolean
      category:
        type: string
      description:
        type: string
      display_name:
        type: string
      mime_type:
        type: string
      position:
        type: integer
      resource_id:
        type: string
      scope:
        type: string
      scope_id:
        type: string
      size_bytes:
        type: integer
      unreadable:
        description: |-
          Unreadable marks an attachment that exists but that this caller cannot
          read. It carries the position (so the row renders in place) and nothing
          else about the resource or its attacher, for the same reason the serving
          path withholds them.
        type: boolean
      uri:
        type: string
    type: object
  attachhttp.attachRequest:
    properties:
      resource_id:
        type: string
    type: object
  attachhttp.listResponse:
    properties:
