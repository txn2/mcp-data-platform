      expires_at:
        type: string
      name:
        example: ci-pipeline
        type: string
      roles:
        example:
        - analyst
        items:
          type: string
        type: array
      source:
        description: '"file", "database", or "both"'
        example: database
        type: string
    type: object
  authevents.Event:
    properties:
      actor:
        description: |-
          Actor is who/what initiated the event. See SystemXxx constants
          for synthetic actors; operator-driven events use the email or
          apikey:name. Required (empty string is rejected at insert).
        type: string
      connection_kind:
        description: Kind is the connection kind (mcp, api, future).
        type: string
      connection_name:
        description: Name is the connection name within the kind.
        type: string
      detail:
        description: |-
          Detail is per-Type JSON. May be nil for events with no extra
          payload.

          swaggertype tag tells swag (used by make swagger) to treat the
          field as a generic object; without it swag can't resolve
          json.RawMessage and the generation step fails.
        type: object
      event_type:
        allOf:
        - $ref: '#/definitions/authevents.Type'
        description: Type is one of the declared TypeXxx constants. Required.
      id:
        description: |-
          ID is the server-assigned row UUID. Empty on inserts; populated
          by the store after the INSERT … RETURNING id.
        type: string
      idp_host:
        description: |-
          IDPHost is the host portion of the IdP token endpoint. Empty
          when not relevant to the event (e.g., TypeTokenDeletedAdmin).
        type: string
      occurred_at:
        description: |-
          OccurredAt is wall-clock time of the event. Empty on inserts;
          the store stamps NOW().
        type: string
    type: object
  authevents.Type:
    enum:
    - connect_started
    - connect_completed
    - refresh_succeeded
    - refresh_failed_transient
    - refresh_failed_revoked
    - refresh_skipped_no_token
    - refresh_skipped_expired
    - refresh_rotation_persistence_failed
    - token_deleted_revoked
    - token_deleted_admin
    type: string
    x-enum-varnames:
    - TypeConnectStarted
    - TypeConnectCompleted
    - TypeRefreshSucceeded
    - TypeRefreshFailedTransient
    - TypeRefreshFailedRevoked
    - TypeRefreshSkippedNoToken
    - TypeRefreshSkippedExpired
    - TypeRefreshRotationPersistenceFailed
    - TypeTokenDeletedRevoked
    - TypeTokenDeletedAdmin
