      category:
        example: correction
        type: string
      confidence:
        example: high
        type: string
      insight_text:
        example: The amount column represents gross margin before returns.
        type: string
    type: object
  admin.insightView:
    properties:
      applied_at:
        type: string
      applied_by:
        description: |-
          AppliedBy, AppliedAt and ChangesetRef record the last application. They are
          retained when a rollback returns the insight to the review queue (#1257), so
          the next reviewer sees the destination and changeset that were already tried
          rather than deciding blind; a pending insight carrying them is one whose
          application was reverted.
        type: string
      captured_by:
        example: analyst@example.com
        type: string
      category:
        example: correction
        type: string
      changeset_ref:
        type: string
      confidence:
        example: high
        type: string
      created_at:
        example: "2026-01-15T14:30:00Z"
        type: string
      entity_urns:
        items:
          type: string
        type: array
      id:
        example: a1b2c3d4e5f67890a1b2c3d4e5f67890
        type: string
      insight_text:
        example: The amount column represents gross margin before returns, not revenue.
        type: string
      observed_entities:
        items:
          $ref: '#/definitions/insightobs.Observation'
        type: array
      persona:
        example: analyst
        type: string
      related_columns:
        items:
          $ref: '#/definitions/knowledge.RelatedColumn'
        type: array
      review_notes:
        example: Verified with data engineering team
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        description: Lifecycle fields (populated by migrations 000007 and 000008)
        example: admin@example.com
        type: string
      session_id:
        example: sess_abc123
        type: string
      sink_class:
        description: |-
          SinkClass is the #633 organizing axis carried onto the backing memory
          record so the unified write path and apply_knowledge sink router can
          route by it. Empty for insights captured before #633.
        example: schema_entity
        type: string
      source:
        example: user
        type: string
      status:
        example: pending
        type: string
      suggested_actions:
        items:
          $ref: '#/definitions/knowledge.SuggestedAction'
        type: array
    type: object
  admin.personaContextDetail:
    properties:
      agent_instructions_override:
        type: string
      agent_instructions_suffix:
        example: Focus on schema details, data lineage, and query optimization.
        type: string
      description_override:
        type: string
