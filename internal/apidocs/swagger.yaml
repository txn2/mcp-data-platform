  audit.Event:
    properties:
      authorized:
        example: true
        type: boolean
      connection:
        example: acme-catalog
        type: string
      content_blocks:
        example: 2
        type: integer
      duration_ms:
        example: 143
        type: integer
      enrichment_applied:
        example: true
        type: boolean
      enrichment_match_kind:
        description: |-
          EnrichmentMatchKind records how the semantic enrichment matched
          the target table or column: "urn" when the URN-equality lookup
          resolved exactly, "semantic" when an exact lookup missed and the
          platform fell back to similarity search (suggested match, not
          asserted), or empty when no enrichment ran. Operators use this
          to measure the false-positive rate of similarity-based
          suggestions (issue #444).
        example: urn
        type: string
      enrichment_mode:
        example: summary
        type: string
      enrichment_tokens_dedup:
        example: 350
        type: integer
      enrichment_tokens_full:
        example: 850
        type: integer
      error_message:
        type: string
      event_kind:
        allOf:
        - $ref: '#/definitions/audit.EventType'
        description: |-
          EventKind is the high-level category of the event. Set to
          "mcp_tool_call" for tools routed through the MCP toolkits (trino,
          datahub, s3, mcp gateway) and "apigateway_invoke" for upstream
          HTTP API calls via the apigateway toolkit. Lets the portal split
          MCP activity from gateway noise without coupling to tool-name
          patterns. See EventType constants in event.go.
        example: mcp_tool_call
      id:
        example: evt_a1b2c3d4e5f6
        type: string
      parameters:
        additionalProperties: {}
        type: object
      persona:
        example: data-engineer
        type: string
      purpose:
        description: |-
          Purpose is the one sentence the caller gave for WHY this call was made:
          the wider task it serves, stated by the agent as the `purpose` argument
          and taken off the request before the tool saw it (issue #1317). Empty on a
          call the platform does not gate, on a caller that cannot thread arguments
          (an MCP App, a script run, the REST shim), and on every row written before
          the feature existed. It is not an argument value, so the parameter
          redaction policy does not apply to it.
        example: Sizing Q3 revenue by region for the board deck.
        type: string
      request_chars:
        example: 120
        type: integer
      request_id:
        example: req_x9y8z7
        type: string
      response_chars:
        example: 2450
        type: integer
      session_id:
