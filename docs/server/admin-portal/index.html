<!--
  This page moved. It was one of the two single-page portal guides; the portal
  documentation is now a section of its own at /portal/, one page per surface.

  The file is a hand-written redirect rather than a mkdocs-redirects entry
  because docs/requirements.txt is hash-pinned and adding a plugin there needs
  a pip-compile run. MkDocs copies any non-Markdown file under docs/ verbatim,
  so this sits at the old URL and answers it.

  MAP covers EVERY anchor the old page published, not only the ones something
  linked to, because a bookmark can name any of them. A reader who saved a
  link into the middle of the old guide lands on the section it meant.
-->
<script>
  (function () {
    var MAP = {
  "activity": "admin-tools/#activity",

  "cross-enrichment-rules-drawer": "admin-connections/#cross-enrichment-rules-drawer",
  "dashboard": "admin-dashboard/",

};

  })();
</script>
