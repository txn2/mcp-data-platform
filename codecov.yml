coverage:
  status:
    project:
      default:
        target: 82%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%
        # Allow some uncovered defensive error handling in new code
        informational: false

# Ignore test files and dev-only fixtures in coverage reports.
ignore:
  - "**/*_test.go"
  - "**/testdata/**"
  # cmd/dev-*-mock are the stand-in upstreams dev/start.sh launches alongside
  # the platform so operators can exercise a gateway end-to-end: dev-mcp-mock
  # (MCP + OAuth) and dev-soap-mock (SOAP 1.1 and 1.2). None is exercised by go
  # test, none has runtime customers, none ships in a release, and writing unit
  # tests for a deterministic mock would be cargo-cult coverage. The pattern is
  # a glob rather than one line per fixture so it stays in step with the local
  # gate, which matches cmd/dev-*-mock in scripts/patch-coverage.sh; naming them
  # one at a time is what let a new fixture pass locally and fail here.
  - "cmd/dev-*-mock/**"
  # internal/httpserver/dbmounts.go holds the two composition-root mount
  # functions (portal + managed-resources REST) whose bodies only run once
  # the platform has constructed its Postgres-backed stores. The project
  # confines real-DB tests to the //go:build integration suite (make
  # test-realdb), which emits no coverage profile, so these lines cannot be
  # covered in the unit-test coverage report. They are exercised by the RealDB
  # integration tests in dbmounts_realdb_integration_test.go.
  - "internal/httpserver/dbmounts.go"
