# osv-scanner.toml: the advisories `make osv` accepts.
#
# `make osv` (part of `make security`, so of `make verify` and CI) fails on any
# advisory osv-scanner reports against go.mod, ui/package-lock.json or
# docs/requirements.txt. A Go advisory whose symbols the module never calls is
# already dropped by osv-scanner's call analysis and needs no entry.
#
# An entry here says: we have read this advisory, it does not reach what we
# ship or has no fix, and we are shipping anyway. It cannot outlive its reason:
#
#   1. ignoreUntil is required. Past that date the entry stops applying and the
#      advisory fails the build again; re-check it before extending the date.
#   2. An entry that no longer matches a finding fails the build. Delete it.
#   3. An advisory with a fixed version is upgraded, not accepted.
#
# Format:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   ignoreUntil = 2027-01-14
#   reason = "why it does not reach what we ship, and why there is no upgrade"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch globparts amplification, fixed only in 11.0.1. Every copy is build tooling that ships in nothing the platform serves and matches no glob a user supplies: minimatch 10.2.6 under eslint, @eslint/config-array, eslint-plugin-import-x, eslint-plugin-sonarjs and @typescript-eslint/typescript-estree (linting the UI source), and 5.1.9 under @redocly/openapi-core (openapi-typescript turning the platform's own swagger.json into types). No upgrade reaches them: the latest eslint (10.14.0) and its plugins require minimatch ^10, and 11 drops the makeRe export eslint imports; @redocly/openapi-core 1.x pins 5.1.9 exactly and openapi-typescript 7.13.0 (latest) requires it, and redocly calls the 5.x default export as a function, which 11 does not provide. Re-check when eslint accepts minimatch 11."
