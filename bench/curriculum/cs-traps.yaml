    - id: cs-net-revenue
      title: Net-revenue reporting policy
      trap_class: net_revenue
      fact: 'Company revenue reporting policy: revenue = amount - discount, over COMPLETED orders only (refunded and pending orders excluded). Amounts are in US cents. A gross figure that ignores discounts or includes non-completed orders is not policy revenue.'
      entity_urn: urn:li:dataset:(urn:li:dataPlatform:trino,memory.bench.orders,PROD)
      sink: knowledge_page
      page:
        slug: revenue-reporting-policy
        title: Revenue Reporting Policy
        body: |-
            # Revenue Reporting Policy

            This is the authoritative definition of "revenue" for all bench warehouse reporting.

            **Revenue = amount - discount, over COMPLETED orders only.** Refunded and pending
            orders are excluded entirely. Any figure that includes refunded orders or ignores
            discounts is gross volume, not revenue, and must not be reported as revenue.

            Two mechanical rules when computing revenue from [orders](urn:li:dataset:(urn:li:dataPlatform:trino,memory.bench.orders,PROD)):

            1. The amount and discount columns are stored as integers in **US cents**.
               Divide by 100 for USD.
            2. Filter on status = 'completed' before summing.

            The pre-aggregated daily_region_revenue index is **gross of discounts** and must
            not be used for policy revenue figures.
      budget_tool_calls: 15
      teach:
        prompt: 'For the analysis ahead I need you to remember a specific working definition and apply it in later sessions. Company revenue reporting policy: revenue = amount - discount, over COMPLETED orders only (refunded and pending orders excluded). Amounts are in US cents. A gross figure that ignores discounts or includes non-completed orders is not policy revenue. Please save this definition to memory now and link it to the dataset it concerns.'
    - id: cs-fiscal-calendar
      title: Fiscal calendar boundaries
      trap_class: fiscal_calendar
      fact: 'The company fiscal year runs February 1 through January 31: fiscal year 2025 is 2025-02-01 through 2026-01-31. Fiscal figures must not be computed over the January-December calendar year.'
      entity_urn: urn:li:dataset:(urn:li:dataPlatform:trino,memory.bench.orders,PROD)
      sink: knowledge_page
      page:
        slug: fiscal-calendar-policy
        title: Fiscal Calendar Policy
        body: |-
            # Fiscal Calendar Policy

            The company fiscal year does **not** align with the calendar year. **Fiscal year
            N begins on February 1 of calendar year N and ends on January 31 of calendar
            year N+1.** Fiscal year 2025 therefore runs **2025-02-01 through 2026-01-31**.

            When a question asks about a "fiscal year", a "fiscal quarter", or "FY" figures,
            use these boundaries, not the calendar year:

            - Fiscal Q1: February – April
            - Fiscal Q2: May – July
            - Fiscal Q3: August – October
            - Fiscal Q4: November – January

            A figure computed over the calendar year (January – December) is a
            calendar-year figure and must not be reported as a fiscal-year figure. Revenue
            inside a fiscal window still follows the Revenue Reporting Policy (net =
            amount - discount over completed orders, amounts in US cents).
      budget_tool_calls: 15
      teach:
        prompt: 'For the analysis ahead I need you to remember a specific working definition and apply it in later sessions. The company fiscal year runs February 1 through January 31: fiscal year 2025 is 2025-02-01 through 2026-01-31. Fiscal figures must not be computed over the January-December calendar year. Please save this definition to memory now and link it to the dataset it concerns.'
