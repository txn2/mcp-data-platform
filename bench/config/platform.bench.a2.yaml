# Benchmark arm A2 — knowledge (issue #930 / #942).
#
# The full discovery-and-knowledge platform: semantic provider (DataHub),
# cross-enrichment on (defaults), the search tool, the search-first gate on
# (default), seeded DataHub metadata and knowledge pages live. Requires a
# DataHub quickstart (same external convention as the e2e and load stacks)
# seeded with bench/seed/datahub/bench_mces.json.
#
# Audit runs with delivery: sync so the harness's audit read-back is
# deterministic: when a tool call returns, its audit row is committed.
#
# Env:
#   API_KEY_ADMIN   admin API key the harness authenticates with (Bearer)
apiVersion: v1

server:
  name: mcp-data-platform-bench-a2
  transport: http
  address: ":8098"

auth:
  api_keys:
    enabled: true
    keys:
      # Base key: the harness's audit read-back (admin REST) credential.
      - key: "${API_KEY_ADMIN}"
        name: "bench-admin"
        roles: ["admin"]
      # Identity pool: one key per task attempt. The search-first gate keys
      # discovery on the authenticated USER identity (apikey:<name>), so
      # attempts must not share a credential or the first search would open
      # the gate for every later attempt. The harness rotates through these
      # (-identity-keys must match the pool size).
      - key: "${API_KEY_ADMIN}-01"
        name: "bench-agent-01"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-02"
        name: "bench-agent-02"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-03"
        name: "bench-agent-03"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-04"
        name: "bench-agent-04"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-05"
        name: "bench-agent-05"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-06"
        name: "bench-agent-06"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-07"
        name: "bench-agent-07"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-08"
        name: "bench-agent-08"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-09"
        name: "bench-agent-09"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-10"
        name: "bench-agent-10"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-11"
        name: "bench-agent-11"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-12"
        name: "bench-agent-12"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-13"
        name: "bench-agent-13"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-14"
        name: "bench-agent-14"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-15"
        name: "bench-agent-15"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-16"
        name: "bench-agent-16"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-17"
        name: "bench-agent-17"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-18"
        name: "bench-agent-18"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-19"
        name: "bench-agent-19"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-20"
        name: "bench-agent-20"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-21"
        name: "bench-agent-21"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-22"
        name: "bench-agent-22"
        roles: ["admin"]
      - key: "${API_KEY_ADMIN}-23"
