database:
  dsn: "postgres://platform:platform_secret@localhost:5432/mcp_platform?sslmode=disable"
  max_open_conns: 10

audit:
  enabled: true
  log_tool_calls: true
  delivery: sync

# The per-user tool-call limiter would throttle the single benchmark identity;
# the benchmark measures agent effectiveness, not the limiter.
rate_limit:
  enabled: false

# workflow.require_search and enrichment.* stay at their defaults (on): the A2
# arm IS the shipped semantic-first configuration.

# The persona is NAMED admin because the admin REST API (the harness's audit
# read-back path) requires the caller's resolved persona to be the deployment's
# admin persona; the name grants nothing by itself — MCP tool access is still
# the allowlist below, which is the arm's ablation surface.
personas:
  admin:
    display_name: "Bench Knowledge (A2)"
    roles: ["admin"]
    tools:
      allow: ["platform_info", "search", "trino_*", "datahub_*", "s3_*"]
    connections:
      allow: ["*"]
  default_persona: admin

semantic:
  provider: datahub
  instance: primary
  cache:
    enabled: true
    ttl: 5m

query:
  provider: trino
  instance: e2e

toolkits:
  trino:
    enabled: true
    default: e2e
    instances:
      e2e:
        host: "localhost"
        port: 8090
        user: "bench"
        catalog: "memory"
        schema: "bench"
        connection_name: "e2e-trino"
    config:
      default_limit: 1000
      max_limit: 10000
      read_only: true

  datahub:
    enabled: true
    default: primary
    instances:
      primary:
        url: "http://localhost:8080/api/graphql"
        # DataHub quickstart ships with metadata-service auth disabled; the
        # provider requires a non-empty token, so a placeholder is supplied.
        token: "bench-placeholder-token"
        read_only: true

  s3:
    enabled: true
    default: e2e
    instances:
      e2e:
        endpoint: "http://localhost:9000"
        access_key_id: "admin"
        secret_access_key: "admin_secret"
        region: "us-east-1"
        use_path_style: true
        connection_name: "e2e-s3"
