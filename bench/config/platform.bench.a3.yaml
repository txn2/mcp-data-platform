database:
  dsn: "postgres://platform:platform_secret@localhost:5432/mcp_platform?sslmode=disable"
  max_open_conns: 10

audit:
  enabled: true
  log_tool_calls: true
  delivery: sync

# The per-user tool-call limiter would throttle the single benchmark identity;
# the benchmark measures agent effectiveness, not the limiter.
rate_limit:
  enabled: false

# workflow.require_search and enrichment.* stay at their defaults (on): A3 is
# the A2 semantic-first configuration plus the lifecycle tools below.

# The persona is NAMED admin because the admin REST API (the harness's audit
# read-back path) requires the caller's resolved persona to be the deployment's
# admin persona; the name grants nothing by itself — MCP tool access is still
# the allowlist below, which is the arm's ablation surface.
personas:
  admin:
    display_name: "Bench Lifecycle (A3)"
    roles: ["admin"]
    tools:
      allow: ["platform_info", "search", "trino_*", "datahub_*", "s3_*", "memory_*", "apply_knowledge", "manage_feedback"]
    connections:
      allow: ["*"]
  default_persona: admin

semantic:
  provider: datahub
  instance: primary
  cache:
    enabled: true
    ttl: 5m

query:
  provider: trino
  instance: e2e

# Lifecycle surface. Memory auto-enables on the shared Postgres; knowledge.apply
# writes promotions to the primary DataHub instance. These are the tools A3 adds
# over A2; the persona allowlist above exposes them to the agent.
#
# The embedding provider is required for the S5 supersede mechanic: recall-first
# supersede detects a restatement by vector similarity, so without embeddings a
# corrected fact is never superseded and the update protocols always duplicate.
# Ollama with nomic-embed-text is the same convention as a real memory-enabled
# deployment (run `ollama serve` + `ollama pull nomic-embed-text` first).
memory:
  embedding:
    provider: ollama
    ollama:
      url: "http://localhost:11434"
      model: nomic-embed-text

knowledge:
  enabled: true
  apply:
    enabled: true
    datahub_connection: primary

toolkits:
  trino:
    enabled: true
    default: e2e
    instances:
      e2e:
        host: "localhost"
        port: 8090
        user: "bench"
        catalog: "memory"
        schema: "bench"
        connection_name: "e2e-trino"
    config:
      default_limit: 1000
      max_limit: 10000
      read_only: true

  datahub:
    enabled: true
    default: primary
    instances:
      primary:
        url: "http://localhost:8080/api/graphql"
        # DataHub quickstart ships with metadata-service auth disabled; the
        # provider requires a non-empty token, so a placeholder is supplied.
        token: "bench-placeholder-token"
        read_only: true

  s3:
    enabled: true
    default: e2e
    instances:
      e2e:
        endpoint: "http://localhost:9000"
        access_key_id: "admin"
        secret_access_key: "admin_secret"
        region: "us-east-1"
        use_path_style: true
        connection_name: "e2e-s3"
