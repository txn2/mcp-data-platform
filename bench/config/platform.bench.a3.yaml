# Benchmark arm A3 — lifecycle-ready (issue #930 / #943).
#
# A2 plus the memory-insight-knowledge lifecycle surface: the agent additionally
# has memory_* (capture/recall) and apply_knowledge (promotion) tools. On the
# single-episode S1-S4 suites A3 has nothing seeded to recall, so it is expected
# to track A2; the lifecycle's teach-once-answer-forever effect is measured by
# the multi-episode S5 protocols (#944). Running A3 on S1-S4 confirms the
# lifecycle tools do not degrade baseline accuracy. Requires the same DataHub
# quickstart as A2 (bench/seed/datahub/bench_mces.json); memory and knowledge
# auto-enable on the shared Postgres.
#
# Audit runs with delivery: sync so the harness's audit read-back is
# deterministic: when a tool call returns, its audit row is committed.
#
# Env:
#   API_KEY_ADMIN   admin API key the harness authenticates with (Bearer)
apiVersion: v1

server:
  name: mcp-data-platform-bench-a3
  transport: http
  address: ":8098"

auth:
  api_keys:
    enabled: true
    keys:
      # Base key: the harness's audit read-back (admin REST) credential.
      - key: "${API_KEY_ADMIN}"
        name: "bench-admin"
        roles: ["admin"]
      # Identity pool: one key per task attempt. The search-first gate keys
      # discovery on the authenticated USER identity (apikey:<name>), so
      # attempts must not share a credential or the first search would open
      # the gate for every later attempt. The harness rotates through these
      # (-identity-keys must match the pool size). Sized to the phase-2 task
      # set at k=3 (87 tasks x 3 = 261). Flow style keeps the pool compact;
      # regenerate with the snippet in bench/README.md if tasks or k grow.
      - {key: "${API_KEY_ADMIN}-001", name: "bench-agent-001", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-002", name: "bench-agent-002", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-003", name: "bench-agent-003", roles: ["admin"]}
