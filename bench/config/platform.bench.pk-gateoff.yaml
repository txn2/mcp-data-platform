database:
  dsn: "postgres://platform:platform_secret@localhost:5432/mcp_bench_pk?sslmode=disable"
  max_open_conns: 10

audit:
  enabled: true
  log_tool_calls: true
  delivery: sync

# The per-user tool-call limiter would throttle the benchmark identities;
# the study measures agent decisions, not the limiter.
rate_limit:
  enabled: false

enrichment:
  trino_semantic_enrichment: false
  datahub_query_enrichment: false
  s3_semantic_enrichment: false
  datahub_storage_enrichment: false

apigateway:
  # Keep the fixture catalog the only discoverable api surface.
  self_connection:
    enabled: false
  util_connection:
    enabled: false

# The persona is NAMED admin because the admin REST API (the harness's
# read-back and apisetup registration path) requires the caller's resolved
# persona to be the deployment's admin persona; MCP tool access is still
# the allowlist below.
#
# list_connections is part of the shipped search-then-invoke flow: the
# api_* tools take a connection name, and the platform's own not-found
# error steers agents to list_connections to discover it. Omitting it sent
# agents guessing connection names in the #1027 pilot.
personas:
  admin:
    display_name: "Bench Perishable Knowledge (PK)"
    roles: ["admin"]
    tools:
      # fetch travels with search: search returns references that only fetch
      # can dereference. An arm that grants search without it measures a
      # delivery architecture the platform does not ship (#1176).
      allow: ["platform_info", "search", "fetch", "list_connections", "api_list_specs", "api_list_endpoints", "api_get_endpoint_schema", "api_invoke_endpoint", "memory_*"]
    connections:
      allow: ["*"]

memory:
  embedding:
    provider: ollama
    ollama:
      url: "http://localhost:11434"
      model: nomic-embed-text

# The single deviation from the pk arm: the gate under probe is off.
workflow:
  require_search: false
