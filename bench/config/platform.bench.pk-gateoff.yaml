# Benchmark arm PK-GATEOFF - search-first gate probe (study-3 due diligence).
#
# Identical to platform.bench.pk.yaml in every respect except that the
# search-first workflow gate is disabled. The probe's question is whether
# agents perform discovery spontaneously when the gate does not force it,
# with every other steering channel (platform_info agent_instructions,
# tool descriptions, and the harness scaffold, when present) unchanged.
# Keep this file a pure copy of the pk arm plus the workflow block below;
# a second difference would confound the gate contrast.
#
apiVersion: v1

server:
  name: mcp-data-platform-bench-pk
  transport: http
  address: ":8098"

auth:
  api_keys:
    enabled: true
    keys:
      # Base key: the harness's audit and insight read-back credential.
      - key: "${API_KEY_ADMIN}"
        name: "bench-admin"
        roles: ["admin"]
      # Identity pool: one key per episode. Attempts must not share a
      # credential, both so per-attempt audit correlation stays clean and
      # because the search-first gate keys discovery on the authenticated
      # identity. RQ4's cross-identity propagation also needs distinct
      # identities to propagate between. Regenerate with the snippet in
      # bench/docs/knowledge-layer-protocol.md if the cell count grows past this.
      - {key: "${API_KEY_ADMIN}-001", name: "bench-agent-001", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-002", name: "bench-agent-002", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-003", name: "bench-agent-003", roles: ["admin"]}
