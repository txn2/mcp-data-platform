database:
  dsn: "postgres://platform:platform_secret@localhost:5432/mcp_platform?sslmode=disable"
  max_open_conns: 10

audit:
  enabled: true
  log_tool_calls: true
  delivery: sync

# The per-user tool-call limiter would throttle the single benchmark identity;
# the benchmark measures agent effectiveness, not the limiter.
rate_limit:
  enabled: false

workflow:
  require_search: false

enrichment:
  trino_semantic_enrichment: false
  datahub_query_enrichment: false
  s3_semantic_enrichment: false
  datahub_storage_enrichment: false

# The persona is NAMED admin because the admin REST API (the harness's audit
# read-back path) requires the caller's resolved persona to be the deployment's
# admin persona; the name grants nothing by itself — MCP tool access is still
# the allowlist below, which is the arm's ablation surface.
personas:
  admin:
    display_name: "Bench Baseline (A0)"
    roles: ["admin"]
    tools:
      allow: ["platform_info", "trino_*", "s3_*"]
    connections:
      allow: ["*"]
  default_persona: admin

toolkits:
  trino:
    enabled: true
    default: e2e
    instances:
      e2e:
        host: "localhost"
        port: 8090
        user: "bench"
        catalog: "memory"
        schema: "bench"
        connection_name: "e2e-trino"
    config:
      default_limit: 1000
      max_limit: 10000
      read_only: true

  s3:
    enabled: true
    default: e2e
    instances:
      e2e:
        endpoint: "http://localhost:9000"
        access_key_id: "admin"
        secret_access_key: "admin_secret"
        region: "us-east-1"
        use_path_style: true
        connection_name: "e2e-s3"
