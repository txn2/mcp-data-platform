# Benchmark arm GT - graph-completion premise probe (issue #1241).
#
# One profile, not an ablation set. The probe varies the seeded corpus (edges
# present or stripped to prose mentions) and the client's tool surface (the
# no-search arms disallow the search tool at the client), never the platform,
# so every cell runs against this one profile.
#
# What the profile has to provide is the smallest surface the task needs:
# knowledge pages (the corpus), search (the discovery entry point) and fetch
# (the only tool that dereferences a reference). Nothing else is present, so a
# cell that fails cannot have failed because the agent went somewhere else:
# there is no warehouse, no catalog, no API connection and no memory to
# consult. Its own database (mcp_bench_gt) keeps the corpus off every other
# study's stack. The no-search arms need no config change: the search-first
# gate blocks only warehouse query tools (DefaultQueryTools), so `fetch` is
# reachable without a search.
#
# The persona deliberately does NOT grant apply_knowledge. That access is what
# switches on the baseline instruction to "prefer several focused, cross-linked
# pages ... build a thin index page that links to them"
# (pkg/platform/instructions/instructions.go), which is authoring steering. An
# episode here reads; telling it how it ought to have written the corpus would
# be a hint about the corpus's shape.
#
# The search-first gate stays at its shipped default (on): search is the
# entry point every cell starts from, so the gate costs one call per episode
# identically in every cell and removes nothing the probe measures.
#
# The embedding provider is required. Page content is embedded in chunks
# (#1244) and search ranks a page by its best-matching chunk; with no provider
# the ranking degrades to lexical and the fixture gate would be reading a
# different search than the one a real deployment runs. Ollama with
# nomic-embed-text is the same convention as the pk arm (run `ollama serve` +
# `ollama pull nomic-embed-text` first).
#
# Audit runs with delivery: sync so a read-back sees a call's row as soon as
# the call returns.
#
# Env:
#   API_KEY_ADMIN   admin API key the harness authenticates with (Bearer)
apiVersion: v1

server:
  name: mcp-data-platform-bench-gt
  transport: http
  address: ":8098"

auth:
  api_keys:
    enabled: true
    keys:
      # Base key: the harness's plant and read-back credential.
      - key: "${API_KEY_ADMIN}"
        name: "bench-admin"
        roles: ["admin"]
      # Identity pool: one key per episode. Attempts must not share a
      # credential, both so per-attempt audit correlation stays clean and
      # because the search-first gate keys discovery on the authenticated
      # identity: a reused identity would start its episode with the gate
      # already open. Sized for 4 cells x k=4 x 4 arms with headroom.
      - {key: "${API_KEY_ADMIN}-001", name: "bench-agent-001", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-002", name: "bench-agent-002", roles: ["admin"]}
      - {key: "${API_KEY_ADMIN}-003", name: "bench-agent-003", roles: ["admin"]}
