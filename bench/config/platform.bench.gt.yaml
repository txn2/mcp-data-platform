database:
  dsn: "postgres://platform:platform_secret@localhost:5432/mcp_bench_gt?sslmode=disable"
  max_open_conns: 10

audit:
  enabled: true
  log_tool_calls: true
  delivery: sync

# The per-user tool-call limiter would throttle the benchmark identities;
# the probe measures agent decisions, not the limiter.
rate_limit:
  enabled: false

enrichment:
  trino_semantic_enrichment: false
  datahub_query_enrichment: false
  s3_semantic_enrichment: false
  datahub_storage_enrichment: false

apigateway:
  # No API surface at all: the corpus is the only thing to discover.
  self_connection:
    enabled: false
  util_connection:
    enabled: false

# The persona is NAMED admin because the portal REST API the planter writes
# through requires the caller's resolved persona to be the deployment's admin
# persona; MCP tool access is still the allowlist below.
#
# list_connections travels with search under the #1176 rule even though this
# arm configures no connections: the three are one delivery surface and an
# arm that grants search without them measures an architecture the platform
# does not ship.
personas:
  admin:
    display_name: "Bench Graph Traversal (GT)"
    roles: ["admin"]
    tools:
      allow: ["platform_info", "search", "fetch", "list_connections"]
    connections:
      allow: ["*"]

memory:
  embedding:
    provider: ollama
    ollama:
      url: "http://localhost:11434"
      model: nomic-embed-text
