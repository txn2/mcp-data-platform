# Benchmark judge calibration set (issue #943).
#
# A human-audited set of (rubric_id, answer, human_label) items. The judge is
# run over these with the pinned rubric model and its agreement with the human
# labels is computed and published: this is the number that tells a reader how
# much to trust the judged caveat scores. Each item's `human` field is the
# authoritative label a reviewer assigned; `answer` is a representative agent
# answer (compliant or not). Both labels are well represented (12 YES / 18 NO
# across 30 items, two YES per criterion) so agreement is not an artifact of a
# one-sided prior.
#
# Update protocol: adding, removing, or relabeling an item does NOT bump the
# rubric version (the criteria are unchanged); it does change the published
# agreement rate, so re-run calibration and update the results page.
