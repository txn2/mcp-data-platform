# MCP Data Platform Configuration
# Copy this file and customize for your environment

apiVersion: v1

# Config storage is selected automatically: set database.dsn to persist config
# mutations (persona CRUD, auth key management) to PostgreSQL. Without a database
# the config is read-only from this file and mutations are blocked.

server:
  name: mcp-data-platform
  transport: stdio              # stdio, http
  address: ":8080"
  tls:
    enabled: false
    cert_file: /etc/ssl/server.crt
    key_file: /etc/ssl/server.key
  streamable:
    session_timeout: 30m        # idle session timeout (default: 30m)
    stateless: false            # disable session tracking
  shutdown:
    grace_period: 25s           # max time to drain in-flight requests (default: 25s)
    pre_shutdown_delay: 2s      # sleep before draining for LB deregistration (default: 2s)

# Session externalization for zero-downtime upgrades
# sessions:
#   store: memory               # "memory" (default) or "database"
#   ttl: 30m                    # session lifetime (defaults to streamable.session_timeout)
#   cleanup_interval: 1m        # cleanup routine frequency
#   # Explicit session handles (#792): platform_info mints a session_id the model
#   # threads on every subsequent tool call — the pattern the MCP 2026-07-28 spec
#   # recommends after removing the Mcp-Session-Id header (SEP-2567).
#   handles:
#     enabled: false            # opt out of explicit session handles (default on)
#     ttl: 8h                   # handle lifetime, refreshed on use (default 8h)
#     require: false            # accept legacy transport sessions without a handle (default on)

# Generic OIDC authentication
auth:
  oidc:
    enabled: false
    issuer: "https://auth.example.com/realms/platform"
    client_id: "mcp-data-platform"
    audience: "mcp-data-platform"
    role_claim_path: "realm_access.roles"
    role_prefix: "dp_"

  api_keys:
    enabled: true
    keys:
      - key: "${API_KEY_ADMIN}"
        name: "admin"
        roles: ["admin"]

# OAuth 2.1 server (for MCP clients like Claude)
oauth:
  enabled: false
  # signing_key is required when oauth is enabled on http transport (startup
  # fails without it): an auto-generated per-process key makes each replica
  # reject its peers' tokens. Generate with: openssl rand -base64 32
  # signing_key: "${OAUTH_SIGNING_KEY}"
  # To rotate without logging users out, move the old key here (verify-only)
  # while signing_key holds the new one; drop it after the access-token TTL.
  # previous_signing_keys:
  #   - "${OAUTH_SIGNING_KEY_OLD}"
  # allow_ephemeral_signing_key: true  # single-replica http dev only; unsafe for replicas
  dcr:
    enabled: true
    allowed_redirect_patterns:
      - "https://.*\\.anthropic\\.com/callback"
      - "http://localhost:.*/callback"
  # /token and /register are rate limited by default (per-IP + a global
  # backstop). Behind a proxy/ingress, list its CIDRs under trusted_proxies so
  # per-client attribution uses the real client IP instead of the proxy's.
  # rate_limit:
  #   enabled: true
  #   trusted_proxies:
  #     - "10.0.0.0/8"
  #   token:
  #     requests_per_minute: 60
  #     burst: 10
  #   register:
  #     requests_per_minute: 10
  #     burst: 3

# PostgreSQL for persistence
database:
  dsn: "${DATABASE_URL}"
  max_open_conns: 25

# Persona definitions
# Connections are deny-by-default: a persona reaches a connection only when
# its connections.allow matches the connection name (the same way tools.allow
# works). An empty/omitted connections block grants no connections, so every
# persona that should use data must list the connections it may reach.
#
# Personas are also the access boundary itself: a caller whose roles match no
# persona here reaches nothing — no tools, and no portal. There is no fallback
# persona, so granting someone access means granting them a role one of these
# personas lists.
#
# Some tools are a unit and must be granted together. `search` returns
# navigational pointers carrying a `reference`; `fetch` is the only tool that
# dereferences one. Granting `search` without `fetch` is a configuration error,
# not a tightening: the persona discovers that an answer exists and can never
# read it, and cannot follow a knowledge page's outbound references at all.
# The same applies to `memory_capture` and `apply_knowledge`, which both write
# into a body of knowledge that `search` is the only way back into. The server
# logs a warning naming the persona and the missing tool at startup and on
# every persona write.
personas:
  # The preferred shape: grant everything, then deny what this persona must not
  # reach. An enumerated allow-list silently loses every tool added by a later
  # upgrade — which is how `fetch` came to be withheld from personas that were
  # written before it existed.
  analyst:
    display_name: "Data Analyst"
    roles:
      - analyst
      - data_engineer
    tools:
      allow:
        - "*"
      deny:
        - "s3_delete_*"
        - "s3_put_object"
        - "apply_knowledge"      # analysts capture insights; curators apply them
    connections:
      allow:
        - "production"
        - "staging"
        - "primary"
        - "data_lake"
    context:
      description_prefix: |
        You are helping a data analyst explore and query data.
        Always check DataHub for context before writing SQL.
      agent_instructions_suffix: |
        Start with search to discover datasets. The search-first gate refuses
        trino_query/trino_execute until you have called search in the session.
        Use trino_describe_table to get schema with business context.

  # An enumerated allow-list, for a deployment that needs one. Every tool the
  # persona will ever hold has to be listed, including both halves of any pair:
  # `search` and `fetch` are here together, and a later upgrade that adds a tool
  # will not reach this persona until an operator adds it by name.
  executive:
    display_name: "Executive"
    roles:
      - executive
      - business_analyst
    tools:
      allow:
        - "platform_info"
        - "search"
        - "fetch"
        - "datahub_get_entity"
        - "datahub_browse"
      deny: []
    connections:
      allow:
        - "primary"
    context:
      description_prefix: |
        You are providing business insights to an executive.
        Focus on what data means, not technical details.

  admin:
    display_name: "Administrator"
    roles:
      - admin
    tools:
      allow:
        - "*"
      deny: []
    connections:
      allow:
        - "*"

  role_mapping:
    oidc_to_persona:
      "dp_admin": "admin"
      "dp_analyst": "analyst"
      "dp_executive": "executive"

# Tool visibility filter and description overrides
# Reduces token usage by hiding tools from tools/list responses.
# This is a visibility filter, not a security boundary — persona auth
# continues to gate tools/call independently.
# tools:
#   allow:
#     - "trino_*"
#     - "datahub_*"
#   deny:
#     - "*_delete_*"
#
#   # Override tool descriptions in tools/list to guide agent behavior.
#   # Built-in overrides for trino_query and trino_execute already encourage
#   # calling datahub_search first. Use this to customize or add more.
#   description_overrides:
#     trino_query: "Custom description for trino_query..."
#     my_custom_tool: "Explain what this tool does"

# Toolkit instances
toolkits:
  trino:
    enabled: false
    instances:
      production:
        host: "trino.example.com"
        port: 443
        user: "${TRINO_USER}"
        password: "${TRINO_PASSWORD}"
        catalog: "iceberg"
        ssl: true
        description: "Production data warehouse for batch analytics and reporting"
      staging:
        host: "trino-staging.example.com"
        port: 8080
        description: "Staging environment for testing queries before production"
    default: production
    config:
      default_limit: 1000
      max_limit: 10000
      read_only: true
      # descriptions:
      #   trino_query: "Execute a SQL query against the data warehouse"
      #   trino_describe_table: "Get table schema with column types and sample data"

  datahub:
    enabled: false
    instances:
      primary:
        url: "https://datahub.example.com/api/graphql"
        token: "${DATAHUB_TOKEN}"
        debug: false            # Enable debug logging for GraphQL operations
        read_only: true         # Restrict to read operations
    default: primary
    config:
      default_limit: 50
      max_lineage_depth: 5
      # descriptions:
      #   datahub_search: "Search the data catalog for datasets and dashboards"
      #   datahub_get_entity: "Get full metadata for a catalog entity by URN"

  s3:
    enabled: false
    instances:
      data_lake:
        region: "us-east-1"
        bucket_prefix: "data-lake-"
        # endpoint: "http://seaweedfs-s3:8333"      # internal/cluster S3 endpoint for data operations
        # public_endpoint: "https://s3.example.com" # externally resolvable endpoint used only to sign
        #                                           # presigned URLs (s3_presign_url); presigned URLs are
        #                                           # signed against it instead of endpoint. Data traffic
        #                                           # keeps using endpoint. Empty falls back to endpoint.
        # use_path_style: true                      # required for SeaweedFS / MinIO style addressing
    default: data_lake
    config:
      read_only: true

# Semantic layer (REQUIRED)
semantic:
  provider: noop              # datahub, noop
  instance: primary
  cache:
    enabled: true
    ttl: 5m

  # URN mapping translates between query engine names and metadata catalog names.
  # This is necessary when Trino uses different catalog/platform names than DataHub.
  #
  # Example: Trino queries "rdbms.public.users" but DataHub stores metadata as
  # "urn:li:dataset:(urn:li:dataPlatform:postgres,warehouse.public.users,PROD)"
  #
  # Configure urn_mapping to bridge this gap:
  urn_mapping:
    # Platform name used in DataHub URNs (e.g., "postgres", "mysql", "trino")
    # If Trino connects to PostgreSQL, set this to "postgres" to match DataHub's platform
    platform: ""

    # Map Trino catalog names to DataHub catalog names
    # Keys are Trino catalogs, values are DataHub catalogs
    catalog_mapping: {}
    # Example:
    # catalog_mapping:
    #   rdbms: warehouse      # Trino "rdbms" → DataHub "warehouse"
    #   iceberg: datalake     # Trino "iceberg" → DataHub "datalake"

  # Lineage-aware semantic enrichment inherits metadata from upstream datasets
  # when columns lack documentation. See docs/lineage.md for details.
  lineage:
    enabled: false            # Enable lineage-aware column inheritance
    max_hops: 2               # Max upstream traversal depth (1-5)
    inherit:                  # Metadata types to inherit
      - glossary_terms
      - descriptions
      # - tags                # Uncomment to also inherit tags
    conflict_resolution: nearest  # nearest, all, skip
    prefer_column_lineage: true   # Use column-level lineage when available
    # column_transforms:      # Path normalization rules
    #   - target_pattern: "*_flattened"
    #     strip_prefix: "payload."
    # aliases:                # Explicit source-target mappings
    #   - source: "warehouse.raw.events"
    #     targets: ["warehouse.analytics.*"]
    cache_ttl: 10m
    timeout: 5s

# Query provider
query:
  provider: noop              # trino, noop
  instance: production

  # URN mapping for DataHub → Trino direction (reverse of semantic urn_mapping)
  # Maps DataHub catalog names back to Trino catalog names for query resolution
  urn_mapping:
    catalog_mapping: {}
    # Example (reverse of semantic mapping):
    # catalog_mapping:
    #   warehouse: rdbms      # DataHub "warehouse" → Trino "rdbms"
    #   datalake: iceberg     # DataHub "datalake" → Trino "iceberg"

# Cross-enrichment. The four enrichment flags default to true (the platform's
# core differentiator is on by default; each is read-only and no-ops without its
# provider). Set a flag to false to disable that direction.
enrichment:
  # trino_semantic_enrichment: true     # Default: true
  # datahub_query_enrichment: true      # Default: true
  # s3_semantic_enrichment: true        # Default: true
  # datahub_storage_enrichment: true    # Default: true

  # Search schema preview
  # Adds a bounded column-name+type preview to datahub_search query_context
  # for available tables, so agents can write SQL without an intermediate
  # datahub_get_schema or trino_describe_table call.
  # search_schema_preview: true            # Default: true
  # schema_preview_max_columns: 15         # Default: 15

  # JSON unwrap default
  # Defaults unwrap_json to true on trino_query and trino_execute so
  # single-row VARCHAR-of-JSON results (e.g. from OpenSearch/Elasticsearch
  # raw_query) are returned as parsed JSON objects instead of double-encoded
  # strings. Upstream fall-through is graceful: non-matching results are
  # unaffected. Set to false to preserve double-encoded VARCHAR behavior.
  # unwrap_json: true                # Default: true

  # Column context filtering
  # Limits column-level semantic enrichment to only columns referenced
  # in the SQL query. Saves tokens when queries touch a subset of wide tables.
  # Only applies to SQL queries (trino_query); trino_describe_table always
  # shows all columns. PII/sensitive columns are always included for safety.
  # column_context_filtering: true   # Default: true

  # Memory-enrichment payload budget (issue #761)
  # Bounds the memory_context block attached to each tool response so recalled
  # memories stay a supporting note rather than crowding out the analyzed data.
  # Records are rendered summary-first with a fetch reference (mcp:memory:<id>);
  # the agent fetches the full record only when the excerpt is not enough.
  # memory_limit: 5                     # Max records recalled per tool call. Default: 5
  # memory_context_budget_bytes: 1500   # Byte budget for rendered summaries; over-budget records become fetchable id+reference stubs; 0 disables. Default: 1500
  # memory_summary_bytes: 280           # Per-record excerpt cap; 0 = full content. Default: 280

  # Session metadata deduplication
  # Avoids repeating large semantic metadata blocks for previously-enriched
  # tables within the same client session, saving LLM context tokens.
  session_dedup:
    enabled: true               # Default: true (dedup is on by default)
    mode: reference             # reference (default), summary, none
    # entry_ttl: 5m             # How long a table stays "already sent" (defaults to semantic.cache.ttl)
    # session_timeout: 30m      # Idle session cleanup (defaults to server.streamable.session_timeout)

# Search-first gate (workflow)
# A hard gate: query tools (trino_query, trino_execute) are refused until the
# agent calls search at least once in the session — the tool handler never runs
# and a SEARCH_REQUIRED error is returned. Once search has been called, the gate
# stays open for the life of the session. Enabled by default; set
# require_search: false to disable gating entirely.
# workflow:
#   require_search: false           # Default: true (gate on). false disables it.
#   # discovery_tools: []           # Tools that satisfy the gate (defaults to search + the datahub_* tools)
#   # query_tools: []               # Tools that are gated (defaults to trino_query, trino_execute)

# Per-user tool-call rate limiting
# A safety net on authenticated tools/call requests, keyed on the authenticated
# user. Bounds a runaway agent loop or a compromised account before it can
# saturate the audit pipeline, the DB pool, or an upstream. NOT a throughput
# throttle — the default (240 rpm, burst 60 per user) is generous enough that
# ordinary use never touches it. Over-limit calls are refused with a RATE_LIMITED
# error before the handler, audit, or upstream run. platform_info is always
# exempt. Enabled by default; set enabled: false to remove the limiter.
# (Distinct from oauth.rate_limit, the per-IP limiter on the OAuth endpoints.)
# rate_limit:
#   enabled: true                   # Default: true. false removes the limiter.
#   requests_per_minute: 240        # Default: 240. Sustained per-user rate (4/second).
#   burst: 60                       # Default: 60. Largest instantaneous per-user burst.
#   # exempt_tools: []              # Tools never limited (platform_info is always exempt)

# Tuning
tuning:
  rules:
    quality_threshold: 0.7
  prompts_dir: ""

# Knowledge capture and apply
# Enables the capture_insight tool for recording domain knowledge.
# Insights are stored in the database for admin review.
# knowledge:
#   enabled: true
#   apply:
#     enabled: false               # apply_knowledge tool (default: true when a database is available)
#     datahub_connection: primary  # Which DataHub instance to write to
#     require_confirmation: true   # Require confirm: true on apply (default: false)
#   pages:                         # Knowledge-page write guards (#705)
#     dedup_threshold: 0.85        # Block creating a page whose content cosine-similarity to an
#                                  # existing one is >= this (re-apply against its slug, or pass
#                                  # force_new). Raw cosine [0,1]; default 0.85. Only acts with a
#                                  # real embedding provider (cosine is not defined without one).
#     dedup_disabled: false        # Set true to turn the create-time duplicate gate off entirely
#     oversize_bytes: 16384        # Body bytes at/above which a non-blocking split suggestion is
#                                  # returned (default 16384; negative disables this arm)
#     oversize_sections: 12        # Heading count at/above which the split suggestion fires
#                                  # (default 12; negative disables this arm)
#   reflexive_capture:             # Reflexive knowledge activation (#635)
#     enabled: true                # Default on when the memory subsystem is available. When a
#                                  # trino query errors and a later related query on the same
#                                  # connection succeeds in the same session, the platform auto-
#                                  # mints one "misconception + fix" correction memory
#                                  # (source=automation), with no operator prompt. Captures enter
#                                  # review as a reviewed sink-class (schema_entity) before any
#                                  # promotion to shared knowledge, so nothing touches live catalog
#                                  # state directly, and are gated by the persona's memory_capture
#                                  # grant. Set false to disable auto-capture entirely.
#   verifiable_insights: true      # Mark a delivered insight as checkable (#1220). Default on. When
#                                  # the catalog entity a claim is about resolves through the query
#                                  # provider to an available table, every delivery surface (search
#                                  # insight hits, fetch of mcp:insight:<id>, and the memory_context
#                                  # enrichment block) carries a verifiable block naming that table
#                                  # and its connection, so the claim arrives with the one query
#                                  # that would settle it. Additive and absent whenever nothing
#                                  # resolves; inert with no query provider. Set false to opt out.

# Portal UI and branding
# portal:
#   enabled: true                                             # single flag to enable portal SPA + API
#   title: "My Data Platform"                                 # sidebar/branding title (default: "MCP Data Platform")
#   tagline: "Sign in to access the platform."                # login-screen subtitle (default: "Sign in to access the platform.")
#   oidc_button_label: "Sign in with ACME Keycloak"           # login-screen SSO button text (default: "Sign in with OIDC")
#   logo: https://example.com/logo.svg                        # logo URL, used if no light/dark specified
#   logo_light: https://example.com/logo-dark.svg             # logo for light theme
#   logo_dark: https://example.com/logo-white.svg             # logo for dark theme
#   public_base_url: "https://portal.example.com"
#   s3_connection: data_lake                                   # S3 toolkit instance for asset storage
#   s3_bucket: portal-assets                                   # bucket for asset storage (default: portal-assets)
#   implementor:                                               # optional implementor brand (far-left header zone)
#     name: "ACME Corp"
#     logo: "https://acme.com/logo.svg"
#     url: "https://acme.com"
#   terms_url: "https://example.com/terms"                     # optional terms-of-service link in notification email footers
#   privacy_url: "https://example.com/privacy"                 # optional privacy-policy link in notification email footers
#   about_text: "The ACME data portal delivers curated datasets and reports."  # optional footer block on all outgoing email
#   support_contact: "help@example.com"                        # optional help contact (email or URL) rendered with about_text
#   reply_to: "support@example.com"                            # optional Reply-To header on all outgoing email
#   rate_limit:                                                 # public portal viewer rate limiting (per-IP + global backstop)
#     requests_per_minute: 60                                   # per-IP limit (default: 60)
#     burst_size: 10                                            # per-IP burst allowance (default: 10)
#     trusted_proxies:                                          # CIDRs whose X-Forwarded-For is trusted; empty trusts none (spoof-safe)
#       - "10.0.0.0/8"
#   export:                                                     # trino_export configuration
#     enabled: true                                             # auto-enabled when portal + trino are configured
#     max_rows: 100000                                          # hard row cap per export (default: 100000)
#     max_bytes: 104857600                                      # hard byte cap in bytes (default: 100 MB)
#     default_timeout: "5m"                                     # default query timeout (default: 5m)
#     max_timeout: "10m"                                        # maximum allowed timeout (default: 10m)

# Admin REST API
# Enabled by default; set enabled: false to disable. The routes still require
# admin-role auth to use — enabling exposes the route, not open access.
# admin:
#   enabled: false              # default: true
#   persona: admin              # persona required for admin access (default: "admin")
#   path_prefix: /api/v1/admin  # URL prefix for admin endpoints

# Resource templates (RFC 6570 URI templates)
# Exposes platform data as browseable, parameterized MCP resources.
# Templates: schema://{catalog}.{schema}/{table}, glossary://{term},
#            availability://{catalog}.{schema}/{table}
# resources:
#   enabled: true
#
#   # User-defined static resources available to MCP clients and agents.
#   # Registered whenever non-empty, independent of resources.enabled.
#   # Use inline content (content:) or a file path (content_file:) — not both.
#   custom:
#     - uri: "brand://theme"
#       name: "Brand Theme"
#       description: "Primary brand colors, logo SVG, and site URL"
#       mime_type: "application/json"
#       content: |
#         {
#           "colors": {"primary": "#FF6B35", "secondary": "#004E89"},
#           "url": "https://example.com"
#         }
#     - uri: "brand://logo"
#       name: "Brand Logo SVG"
#       mime_type: "image/svg+xml"
#       content_file: "/etc/platform/logo.svg"
#
#   # Managed resources: human-uploaded reference material (templates, runbooks,
#   # checklists). Enabled automatically when a database is available; blobs go
#   # to the default S3 toolkit instance unless s3_connection names another.
#   managed:
#     enabled: true             # default: true when a database is configured
#     uri_scheme: mcp           # URI prefix for resource URIs (default: "mcp")
#     s3_connection: data_lake  # S3 toolkit instance for resource blobs
#     s3_bucket: managed-resources
#     # Content revisions kept per resource, counting the current one. A
#     # revision past the cap deletes the oldest version's stored file; the
#     # live content is never pruned. Below 2 is raised to 2.
#     max_versions: 10          # default: 10

# Progress notifications
# Sends granular progress updates to MCP clients during long-running
# Trino queries (requires client to send _meta.progressToken).
# Enabled by default; set enabled: false to opt out.
# progress:
#   enabled: false

# Client logging
# Sends server-to-client log messages (enrichment decisions, timing)
# via MCP logging/setLevel protocol. Zero overhead if client hasn't
# called setLevel. Enabled by default; set enabled: false to opt out.
# client_logging:
#   enabled: false

# Elicitation (user confirmation prompts)
# Requests user confirmation before expensive queries or PII access.
# Requires client-side elicitation support (e.g., Claude Desktop).
# Gracefully degrades to no-op if the client doesn't support elicitation.
# Enabled by default (including cost_estimation and pii_consent); set
# enabled: false at any level to opt out.
# elicitation:
#   enabled: false
#   cost_estimation:
#     enabled: false
#     row_threshold: 1000000    # prompt when EXPLAIN IO estimates > 1M rows
#   pii_consent:
#     enabled: false            # prompt when query accesses PII-tagged columns

# Icons (tool/resource/prompt visual metadata)
# Override or add icons to MCP list responses.
# Upstream toolkits provide default icons; use this to customize.
# Enabled by default; set enabled: false to opt out.
# icons:
#   enabled: false
#   tools:
#     trino_query:
#       src: "https://example.com/custom-trino.svg"
#       mime_type: "image/svg+xml"
#   resources:
#     "schema://{catalog}.{schema}/{table}":
#       src: "https://example.com/schema.svg"
#   prompts:
#     knowledge_capture:
#       src: "https://example.com/knowledge.svg"

# Audit logging
# Both audit and per-tool-call logging are enabled by default when a database is
# available. Set enabled: false to disable audit entirely, or log_tool_calls:
# false to keep audit on but skip per-tool-call rows.
audit:
  enabled: false
  log_tool_calls: true
  retention_days: 90
  # log_parameters: true         # false stores a null parameters field
  # redact_keys: ["password"]    # top-level arg keys masked as [REDACTED] (case-insensitive)
  # delivery: async              # async (default, best-effort) | sync (durable, backpressure)

# Email notifications (shares, feedback threads). Enabled by default when a
# database is available. SMTP host/credentials are admin-configured at runtime
# in the portal (Admin > Settings) or via /api/v1/admin/settings/smtp -- not
# here; the password is encrypted at rest with ENCRYPTION_KEY.
# notifications:
#   enabled: true
#   digest_hour_utc: 13   # UTC hour (0-23) daily digest emails are sent

# API Gateway embedding job queue (the worker that turns spec
# uploads into the per-operation vectors semantic / hybrid
# ranking uses). Defaults are tuned for a GPU embedder; CPU-only
# Ollama deployments processing large specs (~120+ ops) should
# raise embed_timeout and lease_duration, and may want to lower
# batch_size to recover from transient failures with less lost
# work. See #479 for the failure mode that motivated these knobs.
# apigateway:
#   embed_jobs:
#     workers: 1            # goroutines per pod; CPU-only saturates at 1
#     embed_timeout: 5m     # per-batch HTTP call timeout; must be < lease_duration
#     lease_duration: 10m   # claim window the heartbeat re-stamps at lease_duration/3
#     batch_size: 32        # texts per upstream EmbedBatch call
#     retention_days: 14    # purge finished index_jobs history older than this;
#                           # 0 = default (14), negative = disabled (keep forever).
#                           # Open failures and in-flight jobs are never purged.
#   memory:                 # OOM guard for the shared gateway process (#535)
#     # Global ceiling on bytes committed to api_invoke_endpoint response
#     # buffering across ALL api connections. A buffered read that would
#     # exceed this is rejected with a retryable 429 before allocating, so
#     # a burst of large responses (each under its per-request cap) cannot
#     # collectively OOMKill the pod. api_export is exempt: it streams to
#     # S3 and never buffers the full body.
#     # 0 = disabled (per-request caps still apply). Size it ~3x the raw
#     # body per concurrent large request, around
#     # (container_memory_limit * 0.6) / 3 — NOT the whole limit.
#     max_in_flight_bytes: 314572800   # 300 MiB
#     # All-or-nothing cap for the streaming /invoke-raw route. An upstream
#     # Content-Length over this is rejected with a non-retryable 413
#     # before any bytes stream. 0 = no cap (streaming is memory-bounded
#     # regardless; the cap is a policy guard, not a memory guard).
#     raw_max_bytes: 1073741824        # 1 GiB
