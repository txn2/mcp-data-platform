# Example OpenTelemetry Collector configuration for mcp-data-platform traces.
#
# The platform exports spans over OTLP/gRPC when OTEL_TRACES_ENABLED=true and
# OTEL_EXPORTER_OTLP_ENDPOINT points at this collector (default port 4317).
# This config shows the recommended posture: accept OTLP, apply TAIL-BASED
# sampling here (keep every error and slow trace, down-sample the rest), and
# forward to a trace backend (Tempo or Jaeger).
#
# Tail sampling can only keep what arrives. The platform's head sampler
# (OTEL_TRACES_SAMPLER_ARG, default 0.1) decides when a root span starts,
# before its outcome is known, so at the default about 90% of traces never
# leave the platform, errors and slow calls among them, and the policies
# below would keep about 10% of the error traces, not all of them. A
# deployment that uses this file sets OTEL_TRACES_SAMPLER_ARG=1.0 on the
# platform and lets sample-the-rest below do the thinning.
#
# Mount this as a ConfigMap and run the contrib collector image. The platform
# needs no redeploy when you tune the policies below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-data-platform-otel-collector
  labels:
    app.kubernetes.io/name: mcp-data-platform
    app.kubernetes.io/component: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      # Bound memory under load.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 5s
      # Tail-based sampling: decide AFTER a trace is complete so every error
      # and every slow trace that reached the collector is kept, and only the
      # fast, successful majority is down-sampled. With the platform's head
      # sampler at 1.0 (see the header) that is every error and slow trace.
      tail_sampling:
        decision_wait: 10s
        policies:
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: keep-slow
            type: latency
            latency: { threshold_ms: 2000 }
          - name: sample-the-rest
            type: probabilistic
            probabilistic: { sampling_percentage: 10 }

    exporters:
      # Point at your trace backend. Tempo and Jaeger both speak OTLP.
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      # debug:  # uncomment to print spans to the collector log while testing
      #   verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/tempo]
