# The deployment's edge collector (collector-edge.yaml, plus
# collector-substrate.yaml for PostgreSQL, SeaweedFS and ClickHouse), as a
# Deployment the platform exports to. One per mcp-data-platform deployment.
#
# Needs the Secrets clickstack-secrets (ingestion-key) and otel-substrate
# (pg-user, pg-password) from the README; set EDGE_DEPLOYMENT_ID and the
# substrate hosts below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-edge-collector
  labels: {app.kubernetes.io/name: otel-edge-collector, app.kubernetes.io/part-of: mcp-data-platform-observability}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-edge-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-edge-collector, app.kubernetes.io/part-of: mcp-data-platform-observability}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          args:
            - --config=/etc/otelcol/collector-edge.yaml
            - --config=/etc/otelcol/collector-substrate.yaml
          env:
            - {name: EDGE_DEPLOYMENT_ID, value: my-deployment}
            - {name: EDGE_ENVIRONMENT, value: production}
            - {name: EDGE_EXPORT_ENDPOINT, value: "clickstack:4317"}
            - {name: EDGE_EXPORT_INSECURE, value: "true"}
            - name: EDGE_EXPORT_AUTHORIZATION
              valueFrom:
                secretKeyRef: {name: clickstack-secrets, key: ingestion-key}
            - {name: SUBSTRATE_PG_HOST, value: postgres}
            - {name: SUBSTRATE_PG_DATABASE, value: mcp_platform}
            - {name: SUBSTRATE_PG_SSLMODE, value: require}
            - name: SUBSTRATE_PG_USER
              valueFrom:
                secretKeyRef: {name: otel-substrate, key: pg-user}
            - name: SUBSTRATE_PG_PASSWORD
              valueFrom:
                secretKeyRef: {name: otel-substrate, key: pg-password}
            - {name: SUBSTRATE_SEAWEEDFS_METRICS, value: "seaweedfs-s3:9327"}
            - {name: SUBSTRATE_CLICKHOUSE_METRICS, value: "clickstack:9363"}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
      volumes:
        - name: config
          configMap: {name: otel-edge-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-edge-collector
  labels: {app.kubernetes.io/name: otel-edge-collector, app.kubernetes.io/part-of: mcp-data-platform-observability}
spec:
  selector: {app.kubernetes.io/name: otel-edge-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
