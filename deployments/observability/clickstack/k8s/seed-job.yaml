# Applies the dashboards, saved searches and alerts (seed/) through the HyperDX
# API, idempotently by name; re-run it after an upgrade of this bundle
# (kubectl delete job hyperdx-seed && kubectl apply -k .).
#
# Needs the Secret hyperdx-seed (README, "Kubernetes"):
#   api-key       a personal API access key (HyperDX > Team Settings > API Keys)
#   webhook-url   optional: the generic webhook alerts are sent to
apiVersion: batch/v1
kind: Job
metadata:
  name: hyperdx-seed
  labels: {app.kubernetes.io/name: hyperdx-seed, app.kubernetes.io/part-of: mcp-data-platform-observability}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: hyperdx-seed, app.kubernetes.io/part-of: mcp-data-platform-observability}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: python:3.13.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python, -I, /seed/seed.py]
          env:
            - {name: HYPERDX_API_URL, value: "http://clickstack:8000"}
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef: {name: hyperdx-seed, key: api-key}
            - name: HYPERDX_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: hyperdx-seed, key: webhook-url, optional: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: seed, mountPath: /seed}
            - {name: dashboards, mountPath: /seed/dashboards}
      volumes:
        - name: seed
          configMap: {name: hyperdx-seed}
        - name: dashboards
          configMap: {name: hyperdx-seed-dashboards}
