site_name: txn2/mcp-data-platform
site_url: https://mcp-data-platform.txn2.com
site_description: Composable, semantic-first MCP server platform composing DataHub, Trino, and S3 with cross-enrichment, OAuth 2.1, personas, and audit logging
site_author: Craig Johnston
repo_url: https://github.com/txn2/mcp-data-platform
repo_name: txn2/mcp-data-platform
edit_uri: edit/main/docs/

# research/ holds engineering working papers: published (their URLs stay live
# and indexed) but intentionally absent from the nav. Because leaving a page out
# of the nav hides it from browsing and not from search, every page there must
# carry a dated working-paper banner instead — the policy is recorded in
# CONTRIBUTING.md and enforced by TestResearchPagesCarryWorkingPaperBanner.
# TestDocsPagesInNavOrExcluded (verify_test.go) fails on any docs/**/*.md
# that is in neither nav nor this list nor exclude_docs, and only accepts
# the pattern subset it models exactly (see validateExcludePattern).
not_in_nav: |
  /research/

# The homepage does not read this: docs/overrides/home.html replaces Material's
# footer wholesale for that one page, so its home-footer__base line carries the
# same names and has to be edited alongside this value.
copyright: Copyright &copy; 2025 - 2026 <a href="https://imti.co">Craig Johnston</a> / <a href="https://deasil.works">Deasil Works, Inc.</a> / <a href="https://plexara.io">Plexara.io</a>

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/logo.png
  favicon: images/logo.png
  # Two schemes, so the light half of docs/images/screenshots renders. Every
  # screenshot reference on the site is an #only-light / #only-dark pair, and
  # Material's bundled palette CSS hides the half that does not match the
  # active scheme; with a single scheme configured the light half was dead
  # weight (issue #1484).
  #
  # The reader's own system setting decides which scheme they land in: the
  # media queries below are what Material's bundle matches on a first visit,
  # and the toggle then overrides it and is remembered. A small script in
  # partials/header.html applies the same match before the page paints, so a
  # light-preference reader does not get a dark flash first.
  #
  # slate is listed FIRST for the fallback. base.html stamps `palette | first`
  # on <body>, and Material's own resolver clamps a no-match to index 0, so a
  # browser too old to support prefers-color-scheme at all gets dark. Note
  # this is NOT the "expressed no preference" case: per the media-queries
  # spec, `prefers-color-scheme: light` matches when the user has asked for
  # light OR has asked for nothing, so a modern browser always resolves to one
  # of the two.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: switch to dark
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    # Top-level navigation lives in the custom rail header (docs/overrides/partials/header.html).
    # navigation.tabs is intentionally OFF so the full nav tree renders in the left sidebar;
    # with tabs on, removing the Material tab bar would make non-active sections unreachable.
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
    - announce.dismiss

# Three sections: home, docs, portal. The rail header
