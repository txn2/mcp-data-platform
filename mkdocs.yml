# top level is exactly those, so the rail's active item and the sidebar
# section a reader is in never disagree. Nothing here may be orphaned --
# TestDocsPagesInNavOrExcluded fails on any docs/**/*.md that is in neither
# this tree nor not_in_nav nor exclude_docs.
