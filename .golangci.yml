version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # ===== Bug Detection =====
    - errcheck           # Check error returns are handled
    - govet              # Official Go vet checks
    - staticcheck        # Comprehensive static analysis
    - ineffassign        # Detect ineffective assignments
    - unused             # Find unused code
    - bodyclose          # Ensure HTTP response bodies are closed
    - noctx              # Check context usage in HTTP requests
    - rowserrcheck       # Check sql.Rows.Err is checked
    - sqlclosecheck      # Check sql.Rows and sql.Stmt are closed
    - nilerr             # Check nil errors are returned properly
    - nilnil             # Check for nil return with nil error
    - durationcheck      # Detect duration multiplication issues
    - makezero           # Find slice append issues
    - nosprintfhostport  # Check for sprintf host:port issues
    - wastedassign       # Find wasted assignments

    # ===== Code Style =====
    - misspell           # Spelling mistakes
    - unconvert          # Unnecessary type conversions
    - whitespace         # Whitespace issues
    - godot              # Comment punctuation
    - perfsprint         # errors.New over verb-less fmt.Errorf (#901 finding 3.9)

    # ===== Code Quality =====
    - gocritic           # Comprehensive checks
    - revive             # Fast, extensible linter (AI guardrails)
    - gocyclo            # Cyclomatic complexity
    - gocognit           # Cognitive complexity
    - dupl               # Cross-file copy-paste duplication (structural gate, #594)
    - nakedret           # Naked returns in long functions
    - prealloc           # Slice preallocation suggestions
    - predeclared        # Shadowing predeclared identifiers
    - nestif             # Deeply nested ifs
    - goconst            # Repeated strings to constants
    - unparam            # Unused parameters
    - errname            # Error naming conventions
    - errorlint          # Error wrapping issues
    - wrapcheck          # Ensure errors from external packages are wrapped
    - thelper            # Test helper issues

    # ===== Architecture =====
    - depguard           # Import-boundary / layering enforcement (structural gate, #594)

    # ===== Security =====
    - gosec              # Security issues (OWASP)

    # ===== Performance =====
    - copyloopvar        # Loop variable copying

    # ===== Modern Go =====
    - modernize          # Go modernization suggestions

  settings:
    godot:
      exclude:
        - "@"  # Exclude swag annotations

    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      disable:
        - fieldalignment
        - shadow

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 15

    nestif:
      min-complexity: 5

    # dupl flags cross-file copy-paste (structural gate, #594). The
    # threshold is in tokens; 150 is the upstream default and a
    # deliberately permissive starting point. CI runs only-new-issues,
    # so the handful of pre-existing clones are grandfathered and only
    # NEW duplication fails the gate. The largest known clones — the
    # triplicated annotation converter and the per-toolkit error/JSON
    # result helpers — were consolidated into pkg/toolkit (#899); ratchet
    # the threshold DOWN in a follow-up once the remaining clones are gone.
    dupl:
      threshold: 150

    # depguard enforces module-import boundaries that the Go compiler
    # does not (it only forbids cycles, not layering violations). The
    # rules below are derived from the CURRENT import graph so they are
    # green on day one; tighten them in follow-ups. See CONTRIBUTING.md
    # ("Structural maintainability gates") for the rationale and how to
    # adjust. list-mode lax = everything is allowed except the denials.
    depguard:
      rules:
        # pkg/admin is the top composition leaf: it wires handlers onto
        # the assembled platform and is imported ONLY by the composition
        # root — cmd/ plus internal/httpserver, the HTTP-assembly package
        # cmd/ delegates the mux and route table to (#895). Nothing lower
        # in the stack (toolkits, providers, middleware, platform) may
        # reach up into it. A toolkit importing pkg/admin fails here.
        # pkg/admin's own tree is excluded: the leaf may compose its own
        # decomposition subpackages (e.g. pkg/admin/settingsapi) without
        # counting as a lower layer reaching up.
        admin-is-a-leaf:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/cmd/**"
            - "!**/internal/httpserver/**"
            - "!**/pkg/admin/**"
          deny:
            - pkg: github.com/txn2/mcp-data-platform/pkg/admin
              desc: "pkg/admin is a top-level composition leaf wired only by the cmd/ + internal/httpserver composition root; lower layers must not import it (see CONTRIBUTING.md)."
        # Toolkits sit BELOW the platform facade: platform composes
        # toolkits, never the reverse. A toolkit importing pkg/platform
        # would invert the dependency and create the kind of fan-out the
        # gate exists to stop.
        toolkits-do-not-import-platform:
          list-mode: lax
          files:
            - "**/pkg/toolkits/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform/pkg/platform
              desc: "toolkits are a lower layer than pkg/platform; importing it inverts the toolkit->platform layering (see CONTRIBUTING.md)."
        # cmd/ holds the composition roots (entry points). They wire the whole
        # tree together and are the last thing built, so nothing may import
        # them; shared code belongs in pkg/, not in a cmd main.
        entry-point-is-a-sink:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform/cmd
              desc: "cmd/ holds entry points (composition roots); nothing may import it. Move shared code down into pkg/ (see CONTRIBUTING.md)."
        # pkg/toolkit holds the shared toolkit types every toolkit implements.
        # It must stay a dependency ROOT: importing any first-party package
        # would drag implementation detail into the base contract. When it
        # needs behaviour from a higher layer, accept an interface instead.
        base-types-are-a-root:
          list-mode: lax
          files:
            - "**/pkg/toolkit/**"
            - "!**/pkg/toolkits/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform
              desc: "pkg/toolkit is a dependency root for shared toolkit types; it must import nothing first-party (invert the dependency behind an interface). See CONTRIBUTING.md."
        # Provider abstractions (semantic, query, storage) are depended upon by
        # the layers above them. Per the Stable Dependencies Principle they must
        # not depend up: a provider reaching into platform/middleware/admin or a
        # toolkit is an inverted dependency that should be an interface at the
        # boundary instead.
        providers-do-not-depend-up:
          list-mode: lax
          files:
            - "**/pkg/semantic/**"
            - "**/pkg/query/**"
            - "**/pkg/storage/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform/pkg/platform
              desc: "provider abstractions must not depend up on pkg/platform (Stable Dependencies Principle). See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/middleware
              desc: "provider abstractions must not depend up on pkg/middleware. See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/admin
              desc: "provider abstractions must not depend up on pkg/admin. See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/toolkits
              desc: "provider abstractions must not depend up on toolkits; toolkits use providers, not the reverse. See CONTRIBUTING.md."
        # The internal/platform seams were extracted from the facade (#894) so
        # that pkg/platform stays thin: each seam owns one responsibility and
        # the facade composes them. A seam importing the facade back would
        # restore the god-object through the back door, and a seam importing
        # internal/httpserver would invert the composition root's direction
        # (httpserver assembles the platform, never the reverse). Verified
        # against the current graph: no seam imports either package today.
        #
        # What this adds over the compiler: for a seam the facade already
        # composes, the back edge is an import cycle and the compiler rejects
        # it. This rule covers the seams outside that closure — today
        # internal/platform/notifydelivery, which pkg/platform does not reach,
        # so the compiler would accept a facade import there — plus every seam
        # added later.
        #
        # pkg/platform/fieldcrypt is allowed explicitly. depguard matches by
        # path prefix, so denying the facade would otherwise also deny its
        # subpackages, and fieldcrypt is not the facade: it is the shared field
        # encryptor that pkg/platform and pkg/admin both use, and it is pinned
        # as a leaf below (zero first-party imports). That pinning is what keeps
        # this exception narrow — a package that can never import the facade
        # cannot become a route back to it.
        platform-seams-do-not-import-the-facade:
          list-mode: lax
          files:
            - "**/internal/platform/**"
            - "!**/*_test.go"
          allow:
            - github.com/txn2/mcp-data-platform/pkg/platform/fieldcrypt
          deny:
            - pkg: github.com/txn2/mcp-data-platform/pkg/platform
              desc: "internal/platform seams are composed BY pkg/platform; importing it back rebuilds the facade god-object the seams were extracted to prevent (see CONTRIBUTING.md)."
            - pkg: github.com/txn2/mcp-data-platform/internal/httpserver
              desc: "internal/httpserver is the HTTP composition root; a platform seam must not import it (invert the dependency behind an interface). See CONTRIBUTING.md."
        # Leaf utilities: packages that import nothing first-party. Being a leaf
        # is what makes them safely reusable from any layer, and it is a
        # property that erodes silently — one convenience import of the config
        # or platform type is all it takes. Pinning them here makes the erosion
        # a lint failure rather than a ratchet diff that can be regenerated
        # away. Criterion for the list: a package with zero first-party imports
        # is a leaf and belongs here. Verify with
        # `grep -E '^pkg/<name>(/[^ ]*)? -> ' testdata/allowed_internal_imports.txt`
        # returning nothing before adding an entry.
        leaf-utilities-import-nothing-first-party:
          list-mode: lax
          files:
            - "**/pkg/contenttype/**"
            - "**/pkg/ratelimit/**"
            - "**/pkg/oidcdiscovery/**"
            - "**/pkg/platform/fieldcrypt/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform
              desc: "this package is a leaf utility with no first-party imports; keep it that way so any layer can use it (invert the dependency behind an interface or a parameter). See CONTRIBUTING.md."
        # pkg/blobserve and pkg/textpatch sit one layer above the leaves: each
        # imports pkg/contenttype and nothing else first-party, so they cannot
        # be pinned as leaves, but they are still low-level utilities that must
        # not reach up. pkg/textpatch/patchmcp is excluded deliberately — it is
        # the MCP error adapter for pkg/textpatch and imports pkg/middleware by
        # design, which is why the rule targets the package files rather than
        # the whole subtree.
        low-level-utilities-do-not-depend-up:
          list-mode: lax
          files:
            - "**/pkg/blobserve/**"
            - "**/pkg/textpatch/**"
            - "!**/pkg/textpatch/patchmcp/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/mcp-data-platform/pkg/platform
              desc: "low-level utilities must not depend up on pkg/platform (Stable Dependencies Principle). See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/middleware
              desc: "low-level utilities must not depend up on pkg/middleware; the MCP adapter for a utility belongs in its own subpackage. See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/admin
              desc: "low-level utilities must not depend up on pkg/admin. See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/pkg/toolkits
              desc: "low-level utilities must not depend up on toolkits; toolkits use utilities, not the reverse. See CONTRIBUTING.md."
            - pkg: github.com/txn2/mcp-data-platform/internal
              desc: "low-level utilities must not depend on internal/ composition seams. See CONTRIBUTING.md."

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy

    revive:
      severity: error
      confidence: 0.8
      enable-all-rules: false
      rules:
        # ===== Mandatory Style Rules =====
        - name: exported
          severity: error
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
          severity: error
        - name: var-naming
          severity: error
        - name: receiver-naming
          severity: error
        - name: error-naming
          severity: error
        - name: time-naming
          severity: error
        - name: unexported-naming
          severity: error

        # ===== Error Handling (Critical) =====
        - name: error-return
          severity: error
        - name: error-strings
          severity: error
        - name: errorf
          severity: error
        - name: unhandled-error
          severity: error
          arguments: ["fmt.Printf", "fmt.Println", "fmt.Print"]

        # ===== Context Rules (Critical for Services) =====
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: error

        # ===== Import Rules =====
        - name: blank-imports
          severity: error
        - name: dot-imports
          severity: error
        - name: import-shadowing
          severity: error
        - name: import-alias-naming
          severity: warning
          arguments: ["^[a-z][a-z0-9]*$"]

        # ===== Control Flow =====
        - name: if-return
          severity: warning
        - name: indent-error-flow
          severity: error
        - name: superfluous-else
          severity: warning
        - name: early-return
          severity: warning
        - name: empty-block
          severity: error
        - name: unreachable-code
          severity: error
        - name: unconditional-recursion
          severity: error

        # ===== Function Design =====
        - name: function-result-limit
          severity: warning
          arguments: [3]
        - name: argument-limit
          severity: warning
          arguments: [5]
        - name: cognitive-complexity
          severity: warning
          arguments: [15]
        - name: cyclomatic
          severity: warning
          arguments: [10]
        - name: function-length
          severity: warning
          arguments: [80, 0]
        - name: max-public-structs
          severity: warning
          arguments: [5]

        # ===== Variable Rules =====
        - name: var-declaration
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: range
          severity: warning
        - name: range-val-in-closure
          severity: error
        - name: range-val-address
          severity: error
        - name: redefines-builtin-id
          severity: error
        - name: unused-parameter
          severity: warning
        - name: unused-receiver
          severity: warning
        - name: confusing-naming
          severity: warning
        - name: confusing-results
          severity: warning

        # ===== Safety Rules =====
        - name: bare-return
          severity: warning
        - name: get-return
          severity: warning
        - name: modifies-parameter
          severity: warning
        - name: modifies-value-receiver
          severity: error
        - name: deep-exit
          severity: warning
        - name: defer
          severity: warning
          arguments: [["call-chain", "loop", "method-call", "recover", "immediate-recover", "return"]]

        # ===== String Rules =====
        - name: string-of-int
          severity: error
        - name: string-format
          severity: warning
          arguments:
            - - 'fmt.Errorf[0]'
              - '/^[a-z].*[^.]$/'
              - 'error strings should not be capitalized or end with punctuation'

        # ===== Boolean Rules =====
        - name: bool-literal-in-expr
          severity: warning
        - name: constant-logical-expr
          severity: error

        # ===== Type Rules =====
        - name: identical-branches
          severity: error
        - name: datarace
          severity: error
        - name: waitgroup-by-value
          severity: error
        - name: atomic
          severity: error

        # ===== Comment Rules =====
        - name: comment-spacings
          severity: warning
          arguments: ["nolint", "TODO", "FIXME", "BUG", "HACK"]

        # ===== Struct Rules =====
        - name: struct-tag
          severity: error
        - name: unexported-return
          severity: warning

        # ===== Testing Rules =====
        - name: useless-break
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: duplicated-imports
          severity: error

        # ===== Banned Functions (AI Guardrails) =====
        - name: banned-characters
          severity: error
          arguments: ["\u03A9", "\u03A3", "\u03C3"]
        - name: add-constant
          severity: warning
          arguments:
            - maxLitCount: "3"
              allowStrs: '""'
              allowInts: "0,1,2"
              ignoreFuncs: "make,len,cap"

    gosec:
      excludes:
        - G104
        # G706 (log injection via taint analysis) is disabled
        # globally because the project's logging convention — slog
        # with key-value pairs handled by the stdlib text/JSON
        # handlers — escapes/quotes user-controlled values. We accept
        # the loss of static checking here in exchange for fewer
        # noisy false positives. Reviewers must catch any future
        # %-formatted log calls or custom handlers that would
        # bypass that escaping; this rule no longer flags them.
        - G706
      config:
        G306: "0644"

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithStack(
        # toolkit.JSONResultTyped is a result constructor for typed MCP tool
        # handlers; its (any, error) tail exists only to match the handler
        # signature and is always (nil, nil), so there is no error to wrap (#899).
        - .JSONResultTyped(

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    # perfsprint scoped to the errorf check only: a verb-less fmt.Errorf must be
    # errors.New (the durable guard behind #901 finding 3.9). The other
    # perfsprint nudges (strconv/concat/Sprintf simplifications) are left off to
    # keep the linter targeted and non-noisy; CI is only-new-issues, so this
    # gates new code without a mass rewrite of existing Sprintf usage.
    perfsprint:
      integer-format: false # off: strconv nudges for ints
      int-conversion: false
      error-format: true    # parent gate for err-error + errorf; must be on
      err-error: false      # off: do not rewrite .Error() calls
      errorf: true          # on: verb-less fmt.Errorf -> errors.New
      string-format: false  # off: Sprintf1 + strconcat simplifications
      sprintf1: false
      strconcat: false
      bool-format: false
      hex-format: false

  exclusions:
    generated: lax
    paths:
      - ui/node_modules
    rules:
      # Generated files
      - path: generated
        linters:
          - all

      # MCP tool handlers surface failures in-band via CallToolResult.IsError and
      # return a nil Go error — a returned Go error would abort the call instead
      # of letting the model read the message. nilerr flags this legitimate
      # convention, so it is disabled for tool-handler code (#901) rather than
      # suppressed on dozens of individual lines. Scoped to nilerr only; packages
      # that return nil after an error for OTHER reasons (best-effort availability
      # in pkg/storage, pkg/query, pkg/semantic; the resource re-read fallback)
      # keep their per-line justification.
      - path: pkg/toolkits/
        linters:
          - nilerr
      - path: pkg/platform/(find_tools|info|connections)_tool\.go
        linters:
          - nilerr

      # Main packages can have longer functions
      - path: cmd/
        linters:
          - gocyclo
        text: "cyclomatic complexity"

      # Test files: table-driven tests naturally have high cognitive/cyclomatic complexity
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo

      # Test files legitimately repeat fixture/setup blocks; dupl on test
      # bodies would punish standard table-driven and arrange-act-assert
      # structure. Production duplication is still gated.
      - path: _test\.go
        linters:
          - dupl

      - path: _test\.go
        linters:
          - revive
        text: "cognitive-complexity|cyclomatic"

      # Test files use literal values for fixtures — extracting constants hurts readability
      - path: _test\.go
        linters:
          - goconst

      - path: _test\.go
        linters:
          - revive
        text: "add-constant"

      # Test files legitimately contain hardcoded test credentials (G101) and
      # httptest handlers that echo request data (G705 XSS false positives)
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G705"

      # DTO/types packages naturally exceed 5 public structs — their job is to define types
      - path: pkg/audit/
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/admin/
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/oauth/
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/platform/config\.go
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/toolkits/knowledge/types\.go
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/portal/
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/registry/
        linters:
          - revive
        text: "max-public-structs"
      # connoauth's refresher.go exposes the small public surface a
      # multi-replica deployment needs: Refresher, RefresherConfig,
      # NoopLocker, PostgresLocker, plus the ConfigResolver +
      # AdvisoryLocker interfaces. Each is a genuine public-API type,
      # not a candidate for collapse.
      - path: pkg/connoauth/refresher\.go
        linters:
          - revive
        text: "max-public-structs"
      - path: pkg/authevents/
        linters:
          - revive
        text: "max-public-structs"
      # authevents.Writer's helper methods all take a small fixed
      # context tuple (ctx, kind, name, actor, tokenURL) plus a
      # per-type detail. Collapsing that into a struct argument
      # would force every call site (dozens) to construct one — a
      # readability loss for no real benefit.
      - path: pkg/authevents/writer\.go
        linters:
          - revive
        text: "argument-limit"


issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/txn2/mcp-data-platform
  exclusions:
    generated: lax
